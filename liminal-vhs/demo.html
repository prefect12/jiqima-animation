      const g2 = ctx.createGain(); g2.gain.value = .25; o.connect(gg); o2.connect(g2); g2.connect(gg); gg.connect(music);
      [o, o2, lfo].forEach(x => { x.start(w); x.stop(w + d + .05); });
    };
    // 商场背景音乐：Fmaj7 - Em7 - Dm7 - Cmaj7，慢慢地“化”掉
    const CH = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
    const MEL = [[0, 76], [1, 74], [1.5, 72], [2, 69], [4, 74], [5, 72], [5.5, 71], [6, 67], [8, 72], [9, 71], [9.5, 69], [10, 65], [12, 67], [13, 65], [14, 64]];
    const END = LOSE;
    for (let b = 0; b < 5; b++) {
      const t0 = PLAY_IN + b * 4 * beat; if (t0 >= END) break;
      CH[b % 4].forEach(m => { S.at(t0, ep, m, 2.2, .7, t0); S.at(t0 + 2 * beat, ep, m + (m < 55 ? 12 : 0), 1.3, .4, t0 + 2 * beat); });
      S.at(t0, I.subbass, CH[b % 4][0] - 12, 1.6, .5);
    }
    MEL.concat(MEL.map(([b, m]) => [b + 16, m])).forEach(([b, m]) => { const tt = PLAY_IN + b * beat; if (tt < END) S.at(tt, ep, m + 12, .9, .55, tt); });
    // 常驻层：荧光灯 100/120Hz 嗡声（每灭一组就小一截）+ 磁带嘶声
    S.at(0, (w, B) => {
      const { ctx, nb } = bus(B);
      const hum = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; hum.connect(lp); lp.connect(B.sfx);
      [[100, 'sawtooth', .5], [120, 'sawtooth', .3], [240, 'sine', .2]].forEach(([fq, ty, a]) => { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = ty; o.frequency.value = fq; og.gain.value = a; o.connect(og); og.connect(hum); o.start(w + PLAY_IN); o.stop(w + 15.3); });
      hum.gain.setValueAtTime(.0001, w); hum.gain.setValueAtTime(.05, w + PLAY_IN);
      OFF.forEach((ot, i) => hum.gain.setValueAtTime(.05 * Math.max(.0001, 1 - (i + 1) / 6), w + ot));
      const hs = ctx.createBufferSource(), hf = ctx.createBiquadFilter(), hg = ctx.createGain(); hs.buffer = nb; hs.loop = true; hf.type = 'bandpass'; hf.frequency.value = 4200; hf.Q.value = .5;
      hs.connect(hf); hf.connect(hg); hg.connect(B.out); hg.gain.setValueAtTime(.022, w); hg.gain.setValueAtTime(.03, w + LOSE); hg.gain.linearRampToValueAtTime(.16, w + STOP); hg.gain.setValueAtTime(.02, w + STOP + .05); hg.gain.linearRampToValueAtTime(.0001, w + 15);
      hs.start(w); hs.stop(w + 15.3);
    });
    // 画面同步音效
    S.at(PLAY_IN - .05, I.click); S.at(PLAY_IN, I.swish);
    OFF.forEach(ot => { for (let k = 0; k < 4; k++) S.at(ot - .4 + k * .09, I.crackle); S.at(ot, I.thud, .9); S.at(ot, I.tom, 33, .7); S.at(ot + .01, I.click); });
    S.at(DOOR, (w, B) => {                                                       // 自动门：电机嗡 + 滑轨摩擦
      const { ctx } = bus(B), o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), gg = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(95, w); o.frequency.linearRampToValueAtTime(140, w + .5); o.frequency.linearRampToValueAtTime(90, w + DOOR_D);
      lp.type = 'lowpass'; lp.frequency.value = 600; gg.gain.setValueAtTime(.0001, w); gg.gain.exponentialRampToValueAtTime(.12, w + .15); gg.gain.exponentialRampToValueAtTime(.0001, w + DOOR_D + .2);
      o.connect(lp); lp.connect(gg); gg.connect(B.sfx); o.start(w); o.stop(w + DOOR_D + .3);
    });
    S.at(DOOR, I.whoosh, .5); S.at(DOOR + DOOR_D - .05, I.thud, .4);
    S.at(LOSE, I.riser, STOP - LOSE); S.at(STOP, I.click); S.at(STOP, I.thud, .5);
  }
});
