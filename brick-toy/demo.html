<title>积木玩具 · 拼一辆小车</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<script src="../_engine/core.js"></script></head><body><script>
/* 时间常量（画面和声音共用），120 BPM，一拍 0.5 秒 */
const BPM = 120, BEAT = 60 / BPM;
const T_PLATE = 4 * BEAT, T_WHEEL = [5, 5.5, 6, 6.5].map(b => b * BEAT);

const wood = document.createElement('canvas'); wood.width = wood.height = 512;
{
  const w = wood.getContext('2d');
  const tones = ['#C48A52', '#BD8249', '#C9925B', '#B97E47'];
  for (let k = 0; k < 4; k++) { w.fillStyle = tones[k]; w.fillRect(0, k * 128, 512, 128); }
  for (let i = 0; i < 260; i++) {
    const y0 = Math.random() * 512, a = .04 + Math.random() * .1, ph = Math.random() * 6, amp = 1 + Math.random() * 3;
    w.strokeStyle = Math.random() > .5 ? `rgba(90,50,20,${a})` : `rgba(255,220,170,${a * .7})`; w.lineWidth = .6 + Math.random() * 1.6; w.beginPath();
    for (let x = 0; x <= 512; x += 8) { const y = y0 + Math.sin(x / 70 + ph) * amp + Math.sin(x / 23 + ph * 2) * amp * .3; x ? w.lineTo(x, y) : w.moveTo(x, y); }
    w.stroke();
  }

Film({
  title: '积木玩具 · 拼一辆小车', DUR: 15, BPM, poster: 8.4,
  fonts: [['80px "ZCOOL QingKe HuangYou"', '拼一辆小车出发！']],

      gr.addColorStop(0, `rgba(255,255,255,${n[2] > .7 ? .16 : .1})`); gr.addColorStop(.55, 'rgba(255,255,255,0)'); c.fillStyle = gr; c.fill();
      c.lineWidth = 1; c.strokeStyle = 'rgba(20,10,5,.32)';
      edges.forEach(([i, j, hi]) => { const p = P(pts[i]), q = P(pts[j]); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.strokeStyle = hi ? 'rgba(255,255,255,.5)' : 'rgba(25,12,5,.35)'; c.lineWidth = hi ? 1.4 : 1; c.stroke(); });
    };

      const u = [ax[1] * up[2] - ax[2] * up[1], ax[2] * up[0] - ax[0] * up[2], ax[0] * up[1] - ax[1] * up[0]], un = Math.hypot(...u); u.forEach((_, i) => u[i] /= un);
      const v = [ax[1] * u[2] - ax[2] * u[1], ax[2] * u[0] - ax[0] * u[2], ax[0] * u[1] - ax[1] * u[0]];

      for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2 + (opt.rot || 0), cs = Math.cos(a), sn = Math.sin(a); const off = [0, 1, 2].map(k => (u[k] * cs + v[k] * sn) * r); B.push(T.f(base.map((b, k) => b + off[k]))); Tp.push(T.f(base.map((b, k) => b + off[k] + ax[k] * h))); nr.push(T.r(off.map(o => o / r))); }

            const X1 = x0 + cw, Y1 = y0 + cd, C = [[x0, y0, z0], [X1, y0, z0], [X1, Y1, z0], [x0, Y1, z0], [x0, y0, z1], [X1, y0, z1], [X1, Y1, z1], [x0, Y1, z1]].map(T.f);

              { v: [1, 2, 6, 5], n: [1, 0, 0], on: i === nw - 1, e: [[0, 1, 1], [1, 2, j === nd - 1], [3, 0, j === 0]] },

    };
    /* ---------- 积木堆（左边，静止） ---------- */
    [[-4, 4, 0, 2, 4, 1.2, '#F3C623'], [-2, 5, 0, 2, 2, 1.2, '#3A7BD5'], [-4, 8, 0, 4, 2, 1.2, '#43A047'], [-3, 6, 1.2, 2, 2, 1.2, '#F5F1E6'], [0, 7, 0, 1, 2, .4, '#E53935'], [-1, 10, 0, 2, 2, .4, '#F3C623'], [-5, 6, 0, 1, 1, 1.2, '#FB8C00'], [-6, 3, 0, 1, 3, 1.2, '#8E44AD']]
