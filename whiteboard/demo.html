<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>白板讲解 · 大模型怎么猜下一个字</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap">
<script src="../_engine/core.js"></script></head><body><script>
const HAND = '"Long Cang", "Kaiti SC", "STKaiti", cursive';
const BLUE = '#1F3A8A', RED = '#C8372D', INK = '#23272B';
// strokes and writing events, reused by the score so every stroke has a marker sound
const WRITES = [];
Film({
  title: '白板讲解 · 大模型怎么猜下一个字', DUR: 15, BPM: 90, poster: 13.6,
  fonts: [['40px "Long Cang"', '大模型怎么猜下一个字我今天晚上想吃火锅面条沙拉通常挑概率最高的有时也会随机一下示意数字吧。！一个往外']],
  draw(c, t, F) {
    const { W, H, prog, lerp, clamp, hash, rrect, easeOut } = F;
    function penPath(pts, u, color, w) {
      if (u <= 0) return null;
      let total = 0; const seg = [];
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
      let tip = pts[0];
      c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
      for (let pass = 0; pass < 2; pass++) {
        c.beginPath(); c.moveTo(pts[0][0] + pass, pts[0][1] + pass * .6);
        let l = total * clamp(u, 0, 1);
        for (let i = 1; i < pts.length && l > 0; i++) { const f = Math.min(1, l / seg[i - 1]); const x = lerp(pts[i - 1][0], pts[i][0], f), y = lerp(pts[i - 1][1], pts[i][1], f); c.lineTo(x + pass, y + pass * .6); tip = [x, y]; l -= seg[i - 1]; }
        c.globalAlpha *= pass ? .5 : 1; c.stroke(); c.globalAlpha /= pass ? .5 : 1;
      }
      return u < 1 ? tip : null;
    }
    function box(x, y, w, h, seed) {
      const pts = [], n = 60;
      for (let i = 0; i <= n; i++) { const p = i / n * 2 * (w + h); let px, py; if (p < w) { px = x + p; py = y; } else if (p < w + h) { px = x + w; py = y + p - w; } else if (p < 2 * w + h) { px = x + w - (p - w - h); py = y + h; } else { px = x; py = y + h - (p - 2 * w - h); } pts.push([px + (hash(seed + i) - .5) * 3, py + (hash(seed + i * 3) - .5) * 3]); }
      return pts;
    }
    function write(s, x, y, size, color, t0, t1) {
      const u = prog(t, t0, t1); if (u <= 0) return null;
      c.font = `${size}px ${HAND}`; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
      const w = c.measureText(s).width;
      c.save(); c.beginPath(); c.rect(x - 10, y - size * 1.2, 10 + w * u, size * 1.6); c.clip(); c.fillStyle = color; c.fillText(s, x, y); c.restore();
      return u < 1 ? [x + w * u, y - size * .3] : null;
    }
    function marker(tip, color) {
      c.save(); c.translate(tip[0], tip[1]); c.rotate(-.65);
      c.fillStyle = 'rgba(0,0,0,.12)'; rrect(c, 14, 10, 190, 34, 12); c.fill();
      c.fillStyle = '#EDEFF2'; rrect(c, 22, -17, 170, 34, 12); c.fill(); c.strokeStyle = '#8B939B'; c.lineWidth = 2; c.stroke();
      c.fillStyle = color; rrect(c, 150, -19, 58, 38, 10); c.fill();
      c.beginPath(); c.moveTo(22, -12); c.lineTo(2, -3); c.lineTo(0, 0); c.lineTo(2, 3); c.lineTo(22, 12); c.closePath(); c.fillStyle = '#D6DADF'; c.fill(); c.stroke();
      c.beginPath(); c.arc(1, 0, 3.5, 0, Math.PI * 2); c.fillStyle = color; c.fill();
      c.restore();
    }
    // board
    c.fillStyle = '#FBFBF7'; c.fillRect(0, 0, W, H);
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.55, 'rgba(210,222,236,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(120,130,150,.06)'; for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(200 + i * 230, 620 - i * 70, 120, 26, -.2, 0, Math.PI * 2); c.fill(); }
    const wipe = prog(t, 14.1, 14.9);
    c.save();
    if (wipe > 0) { c.beginPath(); c.rect(W * wipe, 0, W, H); c.clip(); }
    let tip = null, col = BLUE;
    const pick = (r, cc) => { if (r) { tip = r; col = cc; } };
    pick(write('大模型怎么“猜”下一个字？', 90, 108, 64, BLUE, .2, 1.7), BLUE);
    pick(penPath(box(90, 214, 390, 108, 3), prog(t, 1.9, 2.7), INK, 5), INK);
    pick(write('我今天晚上想吃', 116, 286, 50, INK, 2.75, 3.4), INK);
    pick(penPath([[492, 268], [548, 266], [604, 268]], prog(t, 3.5, 3.85), INK, 5), INK);
    if (t > 3.85) pick(penPath([[584, 252], [606, 268], [584, 284]], prog(t, 3.85, 4.0), INK, 5), INK);
    [['火锅', .62], ['面条', .21], ['沙拉', .09]].forEach(([w, p], i) => {
      const t0 = 4.05 + i * .9, y = 190 + i * 88, bw = 480 * p;
      pick(write(w, 640, y + 12, 46, INK, t0, t0 + .3), INK);
      pick(penPath(box(752, y - 24, Math.max(bw, 26), 42, 20 + i * 7), prog(t, t0 + .3, t0 + .55), INK, 4), INK);
      const hu = prog(t, t0 + .55, t0 + .75);
      if (hu > 0) { c.save(); c.beginPath(); c.rect(752, y - 24, Math.max(bw, 26), 42); c.clip(); c.strokeStyle = i === 0 ? 'rgba(200,55,45,.75)' : 'rgba(31,58,138,.55)'; c.lineWidth = 4; for (let k = 0; k < 40 * hu; k++) { const x = 752 + k * 14; c.beginPath(); c.moveTo(x, y + 20); c.lineTo(x + 26, y - 26); c.stroke(); } c.restore(); }
      pick(write(Math.round(p * 100) + '%', 772 + bw, y + 12, 42, i === 0 ? RED : BLUE, t0 + .75, t0 + .9), i === 0 ? RED : BLUE);
    });
    const circ = []; for (let i = 0; i <= 70; i++) { const a = -2.6 + i / 70 * Math.PI * 2.25; circ.push([694 + Math.cos(a) * (96 + 6 * Math.sin(i)), 186 + Math.sin(a) * (50 + 4 * Math.cos(i * 1.3))]); }
    pick(penPath(circ, prog(t, 6.9, 7.45), RED, 5), RED);
    pick(write('→ 挑概率最高的那个', 640, 432, 40, RED, 7.5, 8.2), RED);
    // the chosen word flies down and completes the sentence
    pick(write('我今天晚上想吃', 116, 540, 50, INK, 8.4, 9.0), INK);
    if (t > 8.9) {
      const u = easeOut(prog(t, 8.9, 9.5));
      c.font = `50px ${HAND}`; c.fillStyle = RED; c.fillText('火锅', lerp(640, 470, u), lerp(202, 540, u) - 60 * Math.sin(Math.PI * u));
    }
    pick(penPath([[590, 522], [660, 522], [730, 522]], prog(t, 9.8, 10.1), INK, 5), INK);
    if (t > 10.1) pick(penPath([[710, 508], [732, 522], [710, 536]], prog(t, 10.1, 10.25), INK, 5), INK);
    [['吧', .55], ['！', .3], ['。', .15]].forEach(([w, p], i) => {
      const t0 = 10.3 + i * .55, y = 486 + i * 50;
      pick(write(w, 760, y + 12, 38, INK, t0, t0 + .2), INK);
      pick(penPath(box(810, y - 16, 300 * p, 30, 60 + i * 5), prog(t, t0 + .2, t0 + .4), BLUE, 4), BLUE);
    });
    pick(write('……就这样一个字一个字往外猜', 116, 672, 46, BLUE, 12.0, 13.4), BLUE);
    c.font = `26px ${HAND}`; c.fillStyle = 'rgba(35,39,43,.45)'; if (t > 4) c.fillText('（示意数字）', 1090, 668);
    if (tip) marker(tip, col);
    c.restore();
    if (wipe > 0 && wipe < 1) { c.save(); c.translate(W * wipe, 360); c.fillStyle = '#3A4048'; rrect(c, -40, -70, 80, 140, 14); c.fill(); c.fillStyle = '#E8E4DA'; rrect(c, -34, 30, 68, 34, 6); c.fill(); c.restore(); }
    c.fillStyle = '#C9CED4'; c.fillRect(0, 700, W, 20);
  },
  score(S) {
    const { I, beat, bar } = S;
    const PR = [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]], RT = [48, 45, 41, 43];
    S.comp(PR, 0, 6, 'piano', .9, [0, 2]);
    S.drums(1, 6, 'soft', .9);
    S.bassLine(RT, 2, 6, .7);
    // marker sounds follow the writing times used in draw()
    [[.2, 1.5], [1.9, .8], [2.75, .65], [3.5, .5], [4.05, .9], [4.95, .9], [5.85, .9], [6.9, .55], [7.5, .7], [8.4, .6], [9.8, .45], [10.3, .4], [10.85, .4], [11.4, .4], [12.0, 1.4]].forEach(([t, d]) => S.at(t, I.scribble, d));
    S.at(6.9, I.pop2); S.at(9.5, I.pop); S.at(13.4, I.ding);
    S.at(14.1, I.swish);
    S.at(14.2, (w, B) => [60, 64, 67, 72].forEach(m => I.piano(w, B, m, 1, 2)));
  }
});
</script></body></html>
