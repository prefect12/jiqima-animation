<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>财经终端图表 · 定投越早越好</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap">
<script src="../_engine/core.js"></script></head><body><script>
// monthly contribution 1000, 7% a year compounded monthly — every number on screen comes from here
const r = .07 / 12, N = 240, LATE = 60;
const fv = m => m <= 0 ? 0 : 1000 * (Math.pow(1 + r, m) - 1) / r;
const wan = v => (v / 10000).toFixed(1) + ' 万';
const SANS = '"PingFang SC", "Hiragino Sans GB", sans-serif', MONO = '"Roboto Mono", monospace';
const T1 = .9, T2 = 6.3, L1 = 7.9, L2 = 11.2;
Film({
  title: '财经终端图表 · 定投越早越好', DUR: 15, BPM: 100, poster: 12.4,
  fonts: [['20px "Roboto Mono"', '0123456789 万']],
  draw(c, t, F) {
    const { W, H, prog, lerp, ease, easeOut, back, rrect } = F;
    const X0 = 110, X1 = 960, Y0 = 600, Y1 = 190, maxV = 600000;
    const X = m => lerp(X0, X1, m / N), Y = v => lerp(Y0, Y1, v / maxV);
    c.fillStyle = '#0D141E'; c.fillRect(0, 0, W, H);
    const vg = c.createRadialGradient(560, 380, 100, 560, 380, 800); vg.addColorStop(0, 'rgba(40,90,120,.18)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
    const fade = 1 - prog(t, 14.4, 15); c.save(); c.globalAlpha = fade;
    // titles
    const title = (s, t0, t1) => { const a = easeOut(prog(t, t0, t0 + .5)) * (1 - prog(t, t1, t1 + .3)); if (a <= 0) return; c.save(); c.globalAlpha = fade * a; c.font = `600 42px ${SANS}`; c.fillStyle = '#EAF2F8'; c.fillText(s, 110 - 30 * (1 - a), 104); c.restore(); };
    title('每月定投 1000 元，年化 7%，20 年后？', .1, 7.4); title('如果晚 5 年才开始呢？', 7.6, 12.5); title('越早开始，复利越有时间', 12.7, 99);
    c.font = `15px ${MONO}`; c.fillStyle = '#6F8BA3'; c.fillText('按月复利公式计算 · 示意，不构成投资建议', 112, 140);
    // grid + axes
    c.strokeStyle = 'rgba(120,160,200,.12)'; c.lineWidth = 1;
    for (let k = 0; k <= 6; k++) { const y = Y(k * 100000); c.beginPath(); c.moveTo(X0, y); c.lineTo(X1, y); c.stroke(); c.font = `14px ${MONO}`; c.fillStyle = '#5E7A92'; c.fillText(k * 10 + ' 万', 46, y + 5); }
    for (let yr = 0; yr <= 20; yr += 5) { c.fillStyle = '#5E7A92'; c.fillText(yr + ' 年', X(yr * 12) - 14, 628); }
    const line = (fn, from, mf, col, w, glow, dash) => {
      if (mf <= from) return;
      c.save(); if (glow) { c.shadowColor = col; c.shadowBlur = 14; } if (dash) c.setLineDash(dash);
      c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(X(from), Y(fn(from)));
      for (let m = from; m <= mf; m++) c.lineTo(X(m), Y(fn(m))); c.lineTo(X(mf), Y(fn(mf))); c.stroke(); c.restore();
    };
    const u = ease(prog(t, T1, T2)), mf = u * N;
    const late = m => fv(m - LATE), ml = LATE + ease(prog(t, L1, L2)) * (N - LATE);
    // area under the main line
    if (mf > 0) { c.beginPath(); c.moveTo(X(0), Y(0)); for (let m = 0; m <= mf; m++) c.lineTo(X(m), Y(fv(m))); c.lineTo(X(mf), Y(0)); c.closePath(); const ag = c.createLinearGradient(0, Y1, 0, Y0); ag.addColorStop(0, 'rgba(61,220,151,.3)'); ag.addColorStop(1, 'rgba(61,220,151,0)'); c.fillStyle = ag; c.fill(); }
    line(m => m * 1000, 0, mf, '#8A99A8', 3, false, [8, 8]);
    line(fv, 0, mf, '#3DDC97', 4, true);
    if (t > L1) line(late, LATE, ml, '#FF9F43', 4, true);
    const dot = (x, y, col, val) => { c.beginPath(); c.arc(x, y, 7 + 3 * Math.sin(t * 8), 0, Math.PI * 2); c.fillStyle = col; c.fill(); const lx = x > 820 ? x - 160 : x + 14, ly = x > 820 ? y - 12 : y - 40; c.fillStyle = 'rgba(13,20,30,.85)'; rrect(c, lx, ly, 132, 34, 8); c.fill(); c.strokeStyle = col; c.lineWidth = 1.5; c.stroke(); c.font = `700 18px ${MONO}`; c.fillStyle = col; c.fillText(val, lx + 12, ly + 23); };
    if (u > 0 && t < L1) dot(X(mf), Y(fv(mf)), '#3DDC97', wan(fv(mf)));
    if (t >= L1) dot(X(ml), Y(late(ml)), '#FF9F43', wan(late(ml)));
    // cards
    const card = (y, label, val, col) => { c.fillStyle = 'rgba(255,255,255,.04)'; rrect(c, 1010, y, 220, 108, 14); c.fill(); c.strokeStyle = 'rgba(255,255,255,.1)'; c.stroke(); c.font = `17px ${SANS}`; c.fillStyle = '#86A0B6'; c.fillText(label, 1032, y + 34); c.font = `700 36px ${MONO}`; c.fillStyle = col; c.fillText(val, 1032, y + 84); };
    card(190, '投入本金', wan(mf * 1000), '#C9D3DD');
    card(314, '现在就开始', wan(fv(mf)), '#3DDC97');
    if (t >= L1 - .2) { c.save(); c.globalAlpha = fade * easeOut(prog(t, L1 - .2, L1 + .2)); card(438, '晚 5 年开始', wan(late(ml)), '#FF9F43'); c.restore(); }
    const bracket = (t0, ya, yb, label, col, by) => {
      const b = back(prog(t, t0, t0 + .45)); if (b <= 0) return;
      const x = X1 + 18; c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.moveTo(x, ya); c.lineTo(x + 14, ya); c.lineTo(x + 14, yb); c.lineTo(x, yb); c.stroke();
      c.save(); c.translate(1010, by); c.scale(b, b); c.fillStyle = col; rrect(c, 0, 0, 220, 54, 12); c.fill(); c.font = `600 20px ${SANS}`; c.fillStyle = '#1A1405'; c.textAlign = 'center'; c.fillText(label, 110, 35); c.restore();
    };
    if (t < 7.6) bracket(6.5, Y(fv(N)), Y(N * 1000), '复利多出 ' + wan(fv(N) - N * 1000), '#F2C94C', 438);
    bracket(11.5, Y(fv(N)), Y(late(N)), '晚 5 年，少 ' + wan(fv(N) - late(N)), '#F2C94C', 560);
    c.restore();
  },
  score(S) {
    const { I, beat, bar } = S;
    const PR = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 60], [55, 59, 62, 67]], RT = [45, 41, 36, 43];
    S.padBars(PR, 0, 7, 'pad', .9);
    S.drums(1, 6, 'groove', .7);
    S.bassLine(RT, 1, 6, .8);
    // data arpeggio while lines grow
    for (let x = T1; x < T2; x += beat / 2) S.at(x, I.pluck, 72 + [0, 4, 7, 12][Math.round(x / (beat / 2)) % 4], .6);
    for (let x = L1; x < L2; x += beat / 2) S.at(x, I.pluck, 69 + [0, 3, 7, 12][Math.round(x / (beat / 2)) % 4], .6);
    for (let x = .2; x < 13.8; x += .12) S.at(x, I.crackle);
    S.at(6.1, I.riser, .4); S.at(6.5, I.impact); S.at(6.55, I.chime);
    S.at(7.6, I.whoosh);
    S.at(11.1, I.riser, .4); S.at(11.5, I.impact); S.at(11.55, I.ding);
    S.at(12.7, I.whoosh, .7);
    S.at(13.0, (w, B) => [57, 64, 69, 72].forEach(m => I.keys(w, B, m, 1, 2)));
  }
});
</script></body></html>
