<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器马 Animation</title><style>body{margin:0;background:#101710;color:#f3f0df;font:16px/1.6 system-ui}header,main{max-width:1400px;margin:auto;padding:24px}h1{margin:0;font-size:34px}p{color:#b8c5ad}a{color:#d8eaac}input,button{background:#253321;color:#f3f0df;border:1px solid #516443;border-radius:7px;padding:10px;font:inherit}input{width:min(90%,500px)}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}.card{padding:18px;border:1px solid #384833;border-radius:12px;background:#192316}.card h3{margin:8px 0}.badge{font-size:12px;color:#d8eaac}dialog{width:min(1200px,92vw);height:90vh;background:#111b10;color:#eee;border:1px solid #708456;border-radius:12px}dialog::backdrop{background:#000b}iframe{width:100%;height:58vh;border:0;background:#111}pre{white-space:pre-wrap;font:14px/1.7 system-ui}footer{margin:36px 0}footer img{width:170px;background:white;padding:8px}nav{display:flex;gap:18px;flex-wrap:wrap}small{color:#aebda2}</style><header><h1>机器马 Animation</h1><p>30种可运行的代码动画 · 30种精选合集 · 源码、风格规范与可复用提示词</p><nav><a href="https://github.com/prefect12/jiqima-animation">GitHub 源码</a><a href="https://github.com/prefect12/jiqima-animation/releases/tag/v1.1.0">下载30种合集 MP4</a><a href="prompts/30-styles.md">30种提示词</a><a href="README.md">运行与出片说明</a></nav></header><main><input id="search" type="search" placeholder="搜索：像素、水墨、版画……" aria-label="搜索画风"><span style="margin-left:12px;color:#b8c5ad">当前公开：精选30种</span><div class="grid" id="cards"></div><footer><h2>机器马玩AI</h2><p>实用AI工具、教程与动画制作。</p><img src="assets/wechat-qr.jpg" alt="机器马玩AI公众号二维码"><p><small>门类参考 LemoLab / lemo-opuscar。历史动画由Claude制作；开源整理与可移植工具由Codex完成。DeepSeek复刻结果见 experiments，单独标注。</small></p></footer></main><dialog id="detail"><button id="close">关闭</button><h2 id="title"></h2><iframe id="stage" title="动画源码实时预览" allow="autoplay"></iframe><p><a id="code">查看源码</a> · <a id="spec">风格规范</a> · <button id="copy">复制制作指令</button></p><pre id="instruction"></pre><details><summary>完整风格说明</summary><pre id="style"></pre></details></dialog><script src="catalog.js"></script><script>let selectedOnly=false,current=null;const $=id=>document.getElementById(id);function render(){const q=$('search').value.toLowerCase();$('cards').replaceChildren();ANIMATION_STYLES.filter(s=>(!selectedOnly||s.selectedNumber)&&[s.zh,s.en,s.line,s.id].join(' ').toLowerCase().includes(q)).forEach(s=>{const c=document.createElement('article');c.className='card';const tag=document.createElement('div');tag.className='badge';tag.textContent=s.selectedNumber?'合集 '+String(s.selectedNumber).padStart(2,'0')+' / 30':'额外源码';const h=document.createElement('h3');h.textContent=s.zh;const p=document.createElement('p');p.textContent=s.line;const b=document.createElement('button');b.textContent='播放动画 · 看代码';b.onclick=()=>show(s);c.append(tag,h,p,b);$('cards').append(c)})}function show(s){current=s;$('title').textContent=s.zh;$('stage').src=s.id+'/demo.html';$('code').href='https://github.com/prefect12/jiqima-animation/blob/main/'+s.id+'/demo.html';$('spec').href=s.id+'/STYLE.md';$('instruction').textContent='读取 '+s.id+'/STYLE.md 和 '+s.id+'/demo.html，复用 _engine/core.js。用'+s.zh+'制作15秒动画：'+s.story.replace(/[。.!！]+$/,'')+'。保持风格特征：'+s.line+' 输出可播放源码及1080p MP4。';$('style').textContent=s.style;$('detail').showModal()}$('search').oninput=render;$('close').onclick=()=>$('detail').close();$('detail').onclose=()=>$('stage').src='about:blank';$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('instruction').textContent);$('copy').textContent='已复制'}catch{$('copy').textContent='请选中下方文字复制'}};render();</script></html>
