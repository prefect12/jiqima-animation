    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.8; lg.gain.setValueAtTime(0, w); lg.gain.linearRampToValueAtTime(f * .014, w + Math.min(.25, d * .6)); lfo.connect(lg); lg.connect(o.frequency);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = .9;
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.16 * v, w + .035); g.gain.linearRampToValueAtTime(.13 * v, w + Math.max(.06, d - .05)); g.gain.exponentialRampToValueAtTime(.0001, w + d + .1);
    o.connect(bp); bp.connect(g); g.connect(B.lead); o.start(w); lfo.start(w); o.stop(w + d + .15); lfo.stop(w + d + .15);
  },
  splash: (w, B, v = 1) => { const ctx = B.sfx.context; hiss(ctx, B.sfx, w, .5, .3 * v, 'lowpass', 1800, .7, 400); hiss(ctx, B.sfx, w + .03, .25, .15 * v, 'bandpass', 3500, 1.5); tone(ctx, B.sfx, 'sine', 420, w, .002, .12, .12 * v, 160); }
};
