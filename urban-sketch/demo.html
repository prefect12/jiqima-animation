    /* ---------- 淡彩：缓存一张完整的彩色层 ---------- */

      WASHES.forEach(([col, ...polys]) => { let alpha = .5; if (typeof polys[polys.length - 1] === 'number') alpha = polys.pop(); polys.forEach(P => {

        for (let k = 0; k < 3; k++) { K.globalAlpha = alpha * .45; K.fillStyle = col; K.beginPath(); P.forEach(([x, y], i) => { const X = x + ox + (r() - .5) * 10, Y = y + oy + (r() - .5) * 10; i ? K.lineTo(X, Y) : K.moveTo(X, Y); }); K.closePath(); K.fill(); }
        K.globalAlpha = alpha * .5; K.strokeStyle = col; K.lineWidth = 2.4; K.beginPath(); P.forEach(([x, y], i) => i ? K.lineTo(x + ox, y + oy) : K.moveTo(x + ox, y + oy)); K.closePath(); K.stroke(); }); });

      K.globalCompositeOperation = 'destination-out'; for (let k = 0; k < 26; k++) { const x = r() * W, y = r() * H * .9, g = K.createRadialGradient(x, y, 0, x, y, 30 + r() * 60); g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)'); K.globalAlpha = 1; K.fillStyle = g; K.fillRect(x - 100, y - 100, 200, 200); } K.globalCompositeOperation = 'source-over';
      cache[key] = K.canvas; }
    /* ---------- 遮罩：热气走过的地方才有颜色 ---------- */
    const tu = prog(t, ...T.travel), N = PATH.length, M = layer(c, 'mask');
    M.fillStyle = '#000';
    const spot = (x, y, r, b) => { M.beginPath(); BLOBS[b % 6].forEach((m, i) => { const a = i / 36 * Math.PI * 2, rr = r * m; i ? M.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : M.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }); M.closePath(); M.fill(); };
    const st = t > T.steam ? easeOut(prog(t, T.steam, T.steam + 1.2)) : 0;
    if (st > 0) spot(600, 400, 150 * st, 0);                                  // 蒸笼先上色
    for (let i = 0; i < N; i++) { const ti = T.travel[0] + (T.travel[1] - T.travel[0]) * i / (N - 1), k = easeOut(prog(t, ti, ti + 1.3)); if (k > 0) spot(PATH[i][0], PATH[i][1], 150 * k, i); }
    const bl = ease(prog(t, ...T.bloom)); if (bl > 0) spot(560, 430, 470 * bl, 3);
    const Cc = layer(c, 'color'); Cc.setTransform(1, 0, 0, 1, 0, 0); Cc.drawImage(cache[key], 0, 0); Cc.globalCompositeOperation = 'destination-in'; Cc.drawImage(M.canvas, 0, 0);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply'; c.drawImage(Cc.canvas, 0, 0); c.restore();

    /* ---------- 钢笔线稿 ---------- */
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = PEN;
    LINES.forEach(L => { const u = prog(t, L.t0, L.t0 + L.dur); if (u <= 0) return; const P = L.P, m = (P.length - 1) * u, n = Math.floor(m);
      c.lineWidth = L.w; c.globalAlpha = .88; c.beginPath(); c.moveTo(...P[0]); for (let i = 1; i <= n; i++) c.lineTo(...P[i]); if (n < P.length - 1) c.lineTo(...lp(P[n], P[n + 1], m - n)); c.stroke(); });
    c.restore();
    // 招牌上的字：钢笔勾的
    const su = prog(t, LINES_END - .9, LINES_END - .5);
    if (su > 0) { c.save(); c.beginPath(); c.rect(404, 226, 192 * su, 70); c.clip(); c.font = `56px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = PEN; c.fillText('早点', 500, 264); c.restore(); }

    /* ---------- 热气：白色的软团 + 几笔钢笔卷线 ---------- */
    if (t > T.steam) {
      for (let k = 0; k < 7; k++) { const ph = ((t - T.steam) * .45 + k / 7) % 1, a = Math.min(1, (t - T.steam) * 1.5) * Math.sin(Math.PI * ph);
        const x = 600 + Math.sin(ph * 6 + k) * 22 + (k - 3) * 10, y = 345 - ph * 170;
        const g = c.createRadialGradient(x, y, 0, x, y, 30 + ph * 40); g.addColorStop(0, `rgba(255,255,255,${.75 * a})`); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(x - 80, y - 80, 160, 160);
        c.strokeStyle = `rgba(42,37,33,${.45 * a})`; c.lineWidth = 1.1; c.beginPath(); for (let j = 0; j <= 14; j++) { const q = j / 14, xx = x + Math.sin(q * 5 + k + t * 1.2) * 12 * (1 + ph), yy = y + 20 - q * 50; j ? c.lineTo(xx, yy) : c.moveTo(xx, yy); } c.stroke(); }
      // 领头的一团热气沿着路径飘，颜色跟着它走
      if (tu > 0 && tu < 1) { const f = tu * (N - 1), i = Math.floor(f), p = lp(PATH[i], PATH[Math.min(N - 1, i + 1)], f - i);
        const g = c.createRadialGradient(p[0], p[1], 0, p[0], p[1], 70); g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(p[0] - 80, p[1] - 80, 160, 160);
        c.strokeStyle = 'rgba(42,37,33,.55)'; c.lineWidth = 1.2; for (let s = 0; s < 3; s++) { c.beginPath(); for (let j = 0; j <= 20; j++) { const q = j / 20, a = q * Math.PI * 2.6 + t * 3 + s * 2, r = 8 + q * 22; const xx = p[0] - 30 + q * 60 + Math.cos(a) * r * .5, yy = p[1] + Math.sin(a) * r * .5 + (s - 1) * 14; j ? c.lineTo(xx, yy) : c.moveTo(xx, yy); } c.stroke(); } }
    }

    /* ---------- 页脚手写注记 ---------- */
    const nu = prog(t, ...T.note);
    if (nu > 0) { c.save(); c.font = `44px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; const s = '巷口 · 七点十分', w = c.measureText(s).width;
      c.beginPath(); c.rect(36, 10, (w + 20) * nu, 80); c.clip(); c.fillStyle = PEN; c.fillText(s, 44, 62); c.restore(); }
    F.vignette(c, .14, '90,70,50');
    const fo = prog(t, T.fade, 15); if (fo > 0) { c.fillStyle = `rgba(247,243,234,${fo})`; c.fillRect(0, 0, W, H); }
  },
  score(S) {
    const { I, beat, bar } = S;
    const ac = B => B.sfx.context;

    // 钢笔：细碎的高频刮纸声，一段一段
    const nib = (w, B, d, v = .045) => { const x = ac(B), len = Math.ceil(x.sampleRate * (d + .1)), buf = x.createBuffer(1, len, x.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (hashN(i + 5) * 2 - 1) * (.5 + .5 * Math.abs(Math.sin(i / x.sampleRate * 23)));
      const s = x.createBufferSource(); s.buffer = buf; const f = x.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 5200; f.Q.value = 1.1; const g = x.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(v, w + .04); g.gain.setValueAtTime(v, w + d - .08); g.gain.exponentialRampToValueAtTime(.0001, w + d);
      s.connect(f); f.connect(g); g.connect(B.sfx); s.start(w); s.stop(w + d + .05); };
    // 蒸汽：低通噪声慢慢起来
    const steam = (w, B, d, v = .06) => { const x = ac(B), len = Math.ceil(x.sampleRate * (d + .1)), buf = x.createBuffer(1, len, x.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = hashN(i + 17) * 2 - 1;
      const s = x.createBufferSource(); s.buffer = buf; const f = x.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500; const g = x.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(v, w + .8); g.gain.setValueAtTime(v, w + d - 1); g.gain.exponentialRampToValueAtTime(.0001, w + d);
      s.connect(f); f.connect(g); g.connect(B.sfx); s.start(w); s.stop(w + d + .05); };
    // 画线声跟着线稿走：按 0.25 秒一格统计有没有线在画
    for (let x = T.lines[0]; x < LINES_END; x += .25) { const busy = LINES.some(L => L.t0 < x + .25 && L.t0 + L.dur > x); if (busy) S.at(x, nib, .24, .04 + (hashN(x * 10) * .02)); }

    const PR = [[55, 59, 62, 66], [52, 55, 59, 62], [48, 52, 55, 59], [50, 54, 57, 60]];

    [0, 3, 4, 6, 7, 9, 12, 16].forEach((cp, k) => { const ti = T.travel[0] + (T.travel[1] - T.travel[0]) * cp * 6 / (PATH.length - 1); S.at(ti, I.marimba, [67, 71, 74, 76, 79, 81, 83, 86][k], .5); });

  }
