// an invented title sequence: a silhouette detective chases a silhouette cat through the letters of the title

const hitT = k => HIT0 + k * BEAT;                                       // the cat runs into letter k on beat
const T = { bars: 0, iris: 1.0, dash: 2.0, open: 2.5, stop: 8.0, panels: 9.5, card: 12.0, the: 12.7, caseT: 13.0, cn: 13.3, cat: 13.0, det: 13.2 };

function paw(c, x, y, s, rot) { c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = INK; c.beginPath(); c.ellipse(0, 8, 16, 13, 0, 0, 7); c.fill(); [[-17, -8], [-6, -17], [6, -17], [17, -8]].forEach(([px, py]) => { c.beginPath(); c.ellipse(px, py, 6, 8, px * .02, 0, 7); c.fill(); }); c.restore(); }

// title-row slots (top of frame during the chase, centre on the title card)

Film({
