/* the photo (grayscale), in photo-local coords: x ±290, y ±185 */

// sample the scene on a 45° grid → dot radii (shared by every copy of the page this frame)
function photoDots(t) {

    if (Math.abs(x) > PHOTO.w / 2 + 6 || Math.abs(y) > PHOTO.h / 2 + 6) continue;

}

}
function txt(c, s, x, y, size, w = 900, align = 'center', col = INKK, ls = 0) { c.font = `${w} ${size}px ${SERIF}`; c.letterSpacing = ls + 'px'; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); c.letterSpacing = '0px'; }
const typed = (s, t0, t) => s.slice(0, Math.floor(s.length * Math.min(1, Math.max(0, (t - t0) / TYPE))));

  c.save(); c.beginPath(); c.rect(0, 452, PW, 34); c.clip(); for (let k = 1; k <= 6; k++) { c.globalAlpha = .22 / k; txt(c, '宣布竞选市长', 580 + k * (3 + v), 436, 136); } c.restore();

}

Film({
  title: '复古半调印刷 · 柯基竞选市长', DUR: 15, BPM: 120, poster: 13.4,
  fonts: [['900 100px "Noto Serif SC"', '梧桐巷晚报本市一只柯基宣布竞选市长“每条街都要有草坪”政见三条号外'], ['600 30px "Noto Serif SC"', '第1024期今日四版定价伍分星期六·本报讯街口快讯图：候选人“年糕”在街口发表演说一、每条街都有草坪二、下午三点全城午睡三、邮差免于被追']],
  draw(c, t, F) {

    const lamp = c.createRadialGradient(640, 330, 60, 640, 360, 820); lamp.addColorStop(0, 'rgba(120,95,60,.55)'); lamp.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = lamp; c.fillRect(0, 0, W, H);

  },
