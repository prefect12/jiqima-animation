<title>油画厚涂 · 刮开的落日</title>
<script src="../_engine/core.js"></script></head><body><script>
/* 油画厚涂：整幅画由几千笔“有厚度”的笔触组成——每笔 = 投影 + 底色 + 4 道鬃毛沟 + 左上高光 + 笔尾一坨堆起的颜料。

const BPM = 88, BEAT = 60 / BPM;                                   // 0.682 s
const CUT_BEATS = [5, 7, 9, 11, 13], CUTS_T = CUT_BEATS.map(b => b * BEAT), CUT_DUR = .32;

const SUN = [700, 414], SUN_R = 90, HORIZON = 440;

/* ---------- 确定性随机（初始化用） ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// 云：几个漩涡叠在一股向右的风上
const VORT = [[260, 150, 1.1], [620, 90, -.9], [980, 190, 1.2], [1180, 60, -.8], [420, 300, -.7], [860, 330, .8]];

// 落日层：绕着太阳的同心圆笔触，颜色由近到远 白→金→橙→红→紫

  for (let y = -10; y < HORIZON + 20; y += 16) for (let x = -20; x < 1300; x += 18) { const px = x + (r() - .5) * 14, py = y + (r() - .5) * 12, dx = px - SUN[0], dy = py - SUN[1], d = Math.hypot(dx, dy) + (r() - .5) * 40;

const WHEAT = (() => { const r = rng(31), out = [];

const cvs = {};

Film({
