<script src="../_engine/core.js"></script></head><body><script>
// a lift rises through a (fictional) building; every stop opens on a different party
const GOLD = '#D4AF5A', GOLD2 = '#F3DD95', GOLD3 = '#8E6E2E', WALL = '#0C1214', WALL2 = '#141C1F', BRONZE = '#1B2124';

const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const line = (c, x0, y0, x1, y1) => { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); };
const poly = (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); };
function goldGrad(c, y0, y1) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, GOLD2); g.addColorStop(.5, GOLD); g.addColorStop(1, GOLD3); return g; }

/* ---------- the four parties (local coords 0..400 × 0..440) ---------- */
function jazz(c, t) {
  c.fillStyle = '#0D3A32'; c.fillRect(0, 0, OW, OH);
  c.strokeStyle = GOLD; c.lineWidth = 2; for (let r = 60; r <= 230; r += 28) { c.globalAlpha = .25 + (r % 56 ? .35 : 0); c.beginPath(); c.arc(200, 340, r, Math.PI, 0); c.stroke(); } c.globalAlpha = 1;
  const sp = c.createLinearGradient(200, 0, 200, 340); sp.addColorStop(0, 'rgba(243,221,149,.35)'); sp.addColorStop(1, 'rgba(243,221,149,0)'); c.fillStyle = sp; poly(c, [[170, 0], [230, 0], [330, 340], [70, 340]]); c.fill();
  c.fillStyle = '#06201C'; c.fillRect(0, 340, OW, 100); c.fillStyle = GOLD; c.fillRect(0, 338, OW, 3);

  c.translate(30, 0); c.rotate(-.12); c.beginPath(); c.ellipse(0, -46, 26, 34, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(0, -96, 20, 24, 0, 0, 7); c.fill(); c.fillRect(-3, -180, 6, 70); c.restore();

  c.translate(12, -160); c.rotate(-up); c.fillRect(0, -3, 56, 6); poly(c, [[52, -4], [74, -14], [74, 14], [52, 4]]); c.fill(); c.fillStyle = GOLD2; c.beginPath(); c.arc(74, 0, 3, 0, 7); c.fill(); c.restore();

function champagne(c, t) {

  c.strokeStyle = 'rgba(212,175,90,.18)'; c.lineWidth = 1.5; for (let y = 0; y < 360; y += 34) for (let x = (y / 34) % 2 * 20; x < OW + 40; x += 40) { c.beginPath(); c.arc(x, y + 34, 20, Math.PI, 0); c.stroke(); c.beginPath(); c.arc(x, y + 34, 11, Math.PI, 0); c.stroke(); }
  c.fillStyle = '#2B0A12'; c.fillRect(0, 380, OW, 60); c.fillStyle = GOLD; c.fillRect(0, 378, OW, 3);
  const coupe = (x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(243,221,149,.85)'; c.beginPath(); c.moveTo(-26, -40); c.quadraticCurveTo(0, -12, 26, -40); c.closePath(); c.fill(); c.strokeStyle = GOLD2; c.lineWidth = 2; c.beginPath(); c.moveTo(-28, -42); c.quadraticCurveTo(0, -6, 28, -42); c.stroke(); line(c, 0, -22, 0, -4); line(c, -12, 0, 12, 0); c.restore(); };

function ballroom(c, t) {

  // floor in perspective
  const hz = 290; c.fillStyle = '#0A0F1E'; c.fillRect(0, hz, OW, OH - hz);
  c.save(); c.beginPath(); c.rect(0, hz, OW, OH - hz); c.clip(); c.strokeStyle = 'rgba(212,175,90,.55)'; c.lineWidth = 1.5;
  for (let i = -8; i <= 8; i++) line(c, 200 + i * 20, hz, 200 + i * 120, OH);
  for (let j = 0; j < 7; j++) { const y = hz + Math.pow(j / 6, 1.8) * (OH - hz); line(c, 0, y, OW, y); } c.restore();
  // chandelier

  [[70, 40], [52, 62], [34, 84]].forEach(([w, y]) => { c.fillStyle = GOLD; c.fillRect(-w, y, w * 2, 6); for (let x = -w; x <= w; x += 12) { c.globalAlpha = .8; line(c, x, y + 6, x, y + 22 + 6 * Math.sin(x)); c.beginPath(); c.arc(x, y + 24 + 6 * Math.sin(x), 2.5, 0, 7); c.fillStyle = GOLD2; c.fill(); } c.globalAlpha = 1; });

  const glow = c.createRadialGradient(200, 80, 10, 200, 80, 220); glow.addColorStop(0, 'rgba(243,221,149,.28)'); glow.addColorStop(1, 'rgba(243,221,149,0)'); c.fillStyle = glow; c.fillRect(0, 0, OW, 300);

    c.beginPath(); c.arc(-14, -150, 13, 0, 7); c.fill(); c.fillRect(-28, -136, 26, 70); c.fillRect(-27, -66, 10, 66); c.fillRect(-13, -66, 10, 66); poly(c, [[-28, -80], [-40, -60], [-24, -66]]); c.fill();
    c.beginPath(); c.arc(16, -144, 12, 0, 7); c.fill(); poly(c, [[6, -130], [26, -130], [30, -80], [52, 0], [-6, 0], [4, -80]]); c.fill();
    c.strokeStyle = '#04060C'; c.lineWidth = 7; line(c, -6, -118, 16, -112); c.restore();

}
function roof(c, t, F) {

  c.fillStyle = '#FFF4D0'; for (let i = 0; i < 50; i++) { c.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * 2 + i)); c.fillRect(hash(i) * OW, hash(i + 50) * 260, 1.6, 1.6); } c.globalAlpha = 1;
  c.fillStyle = GOLD2; c.beginPath(); c.arc(80, 64, 20, 0, 7); c.fill(); c.fillStyle = '#0B0F2C'; c.beginPath(); c.arc(89, 58, 18, 0, 7); c.fill();

  for (let k = 0; k < 10; k++) {
    const t0 = b(30.5) + k * BEAT, u = (t - t0) / 1.1; if (u < 0 || u > 1) continue;

    c.strokeStyle = col; c.globalAlpha = 1 - u; c.lineWidth = 2;
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; line(c, x + Math.cos(a) * r * .45, y + Math.sin(a) * r * .45, x + Math.cos(a) * r, y + Math.sin(a) * r); }
    c.fillStyle = col; for (let i = 0; i < 16; i++) { const a = (i + .5) / 16 * Math.PI * 2; c.beginPath(); c.arc(x + Math.cos(a) * r * 1.1, y + Math.sin(a) * r * 1.1 + u * u * 20, 2, 0, 7); c.fill(); }

  towers.forEach(([x, w, h], i) => {
    const y = OH - h + 120; c.fillStyle = '#05060F'; c.fillRect(x, y, w, OH); c.fillRect(x + w * .15, y - 20, w * .7, 22); c.fillRect(x + w * .3, y - 38, w * .4, 20); c.fillRect(x + w / 2 - 2, y - 70, 4, 34);
    c.fillStyle = 'rgba(243,221,149,.75)'; for (let yy = y + 10; yy < OH; yy += 16) for (let xx = x + 6; xx < x + w - 6; xx += 10) if (hash(xx * 7 + yy + i) > .55) c.fillRect(xx, yy, 4, 7);
  });

  c.fillStyle = '#05060F'; c.fillRect(0, 392, OW, 48); c.strokeStyle = GOLD; c.lineWidth = 2; line(c, 0, 392, OW, 392);

}
const SCENES = [jazz, champagne, ballroom, roof];

/* ---------- architecture ---------- */
function frameSteps(c, o) {
  poly(c, [[OX - o, 680], [OX - o, OY - o], [OX + 60 - o, OY - o], [OX + 60 - o, 150 - o], [OX + 100 - o, 150 - o], [OX + 100 - o, 70 - o], [OX + OW - 100 + o, 70 - o], [OX + OW - 100 + o, 150 - o], [OX + OW - 60 + o, 150 - o], [OX + OW - 60 + o, OY - o], [OX + OW + o, OY - o], [OX + OW + o, 680]]);
}
function doorFace(c) { // both doors as one picture; the seam splits the sunburst
  const g = c.createLinearGradient(OX, 0, OX + OW, 0); g.addColorStop(0, '#12171A'); g.addColorStop(.5, '#262D31'); g.addColorStop(1, '#12171A'); c.fillStyle = g; c.fillRect(OX, OY, OW, OH);
  c.strokeStyle = GOLD; c.lineWidth = 2; c.strokeRect(OX + 12, OY + 12, OW / 2 - 24, OH - 24); c.strokeRect(OX + OW / 2 + 12, OY + 12, OW / 2 - 24, OH - 24);
  const cx = OX + OW / 2, cy = OY + 190;
  c.lineWidth = 2.5; c.beginPath(); c.arc(cx, cy, 130, 0, 7); c.stroke(); c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, 120, 0, 7); c.stroke();
  c.lineWidth = 1.4; for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2; line(c, cx + Math.cos(a) * 26, cy + Math.sin(a) * 26, cx + Math.cos(a) * (i % 2 ? 100 : 116), cy + Math.sin(a) * (i % 2 ? 100 : 116)); }
  c.fillStyle = GOLD; c.beginPath(); c.arc(cx, cy, 16, 0, 7); c.fill();
  c.lineWidth = 2; for (let k = 0; k < 5; k++) { const y = OY + 360 + k * 13; poly(c, [[OX + 40, y + 30], [cx, y], [OX + OW - 40, y + 30]]); c.stroke(); }
  for (let k = 0; k < 4; k++) { c.strokeRect(cx - 150 + k * 8, OY + 30 + k * 6, 300 - k * 16, 0.1); }
  c.fillStyle = '#07090A'; c.fillRect(cx - 1.5, OY, 3, OH);
}
function architecture(c, t, F, open, fl, rising) {
  const { W, H } = F;
  c.fillStyle = WALL; c.fillRect(-400, -400, W + 800, H + 800);
  // fluted wall
  c.strokeStyle = 'rgba(212,175,90,.10)'; c.lineWidth = 1; for (let x = 0; x <= W; x += 22) line(c, x, 0, x, 680);
  // sunburst behind the dial
  c.strokeStyle = 'rgba(212,175,90,.35)'; for (let i = 0; i <= 36; i++) { const a = Math.PI + i / 36 * Math.PI; line(c, 640 + Math.cos(a) * 118, 190 + Math.sin(a) * 118, 640 + Math.cos(a) * 640, 190 + Math.sin(a) * 640); }
  // side panels with fan sconces and a chevron frieze
  [[70, 270], [1010, 1210]].forEach(([x0, x1]) => {
    const cx = (x0 + x1) / 2; c.strokeStyle = 'rgba(212,175,90,.55)'; c.lineWidth = 1.5; c.fillStyle = WALL2;
    c.fillRect(x0, 110, x1 - x0, 560); c.strokeRect(x0, 110, x1 - x0, 560); c.strokeRect(x0 + 12, 122, x1 - x0 - 24, 536);
    for (let k = 0; k < 4; k++) { const y = 560 + k * 22; poly(c, [[x0 + 24, y + 18], [cx, y], [x1 - 24, y + 18]]); c.stroke(); }
    const glow = c.createRadialGradient(cx, 300, 10, cx, 300, 190); glow.addColorStop(0, 'rgba(243,221,149,.32)'); glow.addColorStop(1, 'rgba(243,221,149,0)'); c.fillStyle = glow; c.fillRect(x0, 110, x1 - x0, 400);
    c.fillStyle = 'rgba(243,221,149,.18)'; c.beginPath(); c.moveTo(cx - 60, 320); c.arc(cx, 320, 60, Math.PI, 0); c.closePath(); c.fill();
    c.strokeStyle = GOLD; c.lineWidth = 2; c.stroke(); for (let i = 1; i < 8; i++) { const a = Math.PI + i / 8 * Math.PI; line(c, cx, 320, cx + Math.cos(a) * 60, 320 + Math.sin(a) * 60); }
    c.fillStyle = GOLD; c.fillRect(cx - 4, 320, 8, 70); c.fillRect(cx - 18, 386, 36, 6);
    for (let k = 0; k < 5; k++) { c.strokeStyle = 'rgba(212,175,90,.5)'; line(c, x0 + 30 + k * 8, 160 + k * 8, x1 - 30 - k * 8, 160 + k * 8); }
  });
  c.strokeStyle = 'rgba(212,175,90,.6)'; c.lineWidth = 1.5; poly(c, Array.from({ length: 65 }, (_, i) => [i * 20, i % 2 ? 22 : 38])); c.stroke(); line(c, 0, 14, W, 14); line(c, 0, 46, W, 46);

  const na = Math.PI + (fl - 1) / 11 * Math.PI; c.strokeStyle = GOLD2; c.lineWidth = 3; line(c, 640, 190, 640 + Math.cos(na) * 58, 190 + Math.sin(na) * 58); c.fillStyle = GOLD; c.beginPath(); c.arc(640, 190, 8, 0, 7); c.fill();

Film({
  title: '装饰艺术 · 电梯直达顶楼', DUR: 15, BPM: 144, poster: 7.0,
  fonts: [['40px "Poiret One"', 'THE ROOF 12'], ['20px Limelight', '0123456789'], ['60px "ZCOOL XiaoWei"', '三楼爵士乐队六楼香槟塔九楼舞会顶楼·']],
  draw(c, t, F) {
    const { W, H, prog, lerp, ease, easeOut, easeIn, back, keyframes } = F;
    const fl = keyframes(FLOOR, t)[0];
    // which stop / how open
    let open = 0, si = -1;

    c.save(); if (reveal < 1) { c.beginPath(); c.rect(640 - 700 * reveal, 0, 1400 * reveal, H); c.clip(); }

    // interior + doors
    c.save(); c.beginPath(); c.rect(OX, OY, OW, OH); c.clip();
    if (open > 0 && si >= 0) { c.save(); c.translate(OX, OY); SCENES[si](c, t, F); c.restore(); }
    const d = open * OW / 2;
