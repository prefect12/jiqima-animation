      c.shadowColor = 'rgba(30,40,60,.2)'; c.shadowBlur = 16; c.shadowOffsetY = 6; c.fillStyle = '#FFD84D'; rrect(c, -w / 2, -30, w, 60, 30); c.fill(); c.shadowColor = 'transparent';
      c.fillStyle = INK; c.textAlign = 'center'; c.fillText('排序 · 筛选 · 一键出图表', 0, 11); c.restore();
    }
    const fo = prog(t, FADE, 15); if (fo > 0) { c.fillStyle = `rgba(228,234,241,${fo})`; c.fillRect(0, 0, W, H); }

    function drawHero(m) {
      const R = 26, air = m.air, run = air ? 0 : 0;
      let sx = 1, sy = 1;
      if (air) { sx = .92; sy = 1.1; }
      if (landK > 0) { sx = 1 + .25 * landK; sy = 1 - .22 * landK; }
      const bx = m.x, by = m.y - 12 - R * sy;         // 身体中心
      // 影子
      if (t > DROP[0]) { c.save(); c.globalAlpha = .18; c.fillStyle = '#1F2733'; c.beginPath(); c.ellipse(m.x, m.y + 1, 22 * (air ? .7 : 1), 5, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
      // 腿
      c.strokeStyle = '#3B3A36'; c.lineWidth = 3.2; c.lineCap = 'round';
      const legSw = air ? .5 : 0;
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(bx + s * 8, by + R * sy - 4); c.lineTo(bx + s * (10 + legSw * 4), m.y - (air ? 4 : 0)); c.stroke(); c.beginPath(); c.moveTo(bx + s * (10 + legSw * 4), m.y - (air ? 4 : 0)); c.lineTo(bx + s * (15 + legSw * 4), m.y - (air ? 4 : 0)); c.stroke(); });
      // 手臂
      const wave = (t > 1.3 && t < 2.0) || t > 13.4 ? Math.sin(t * 18) : 0, cheer = (t > PUT && t < 3.5) || (t > 12.0 && t < 12.5) || (t > 9.0 && t < 9.4) || JOY.some(j => t > j && t < j + .35) || m.carry;
      [-1, 1].forEach(s => {
        let hx, hy;
        if (m.carry) { hx = bx + s * 28; hy = by - 14; }
        else if (cheer) { hx = bx + s * 30; hy = by - 32; }
        else if (s === 1 && wave) { hx = bx + 32; hy = by - 26 + wave * 8; }
        else if (air) { hx = bx + s * 34; hy = by - 6; }
        else { hx = bx + s * 30; hy = by + 16 + Math.sin(t * 6 + s) * 2; }
        c.beginPath(); c.moveTo(bx + s * R * .8, by + 4); c.quadraticCurveTo(bx + s * (R + 6), (by + hy) / 2 + 4, hx, hy); c.stroke();
        if (!m.carry) { c.fillStyle = '#F4F0E6'; c.beginPath(); c.arc(hx, hy, 5, 0, Math.PI * 2); c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#8C8373'; c.stroke(); c.lineWidth = 3.2; c.strokeStyle = '#3B3A36'; }
      });
      // 身体：不规则轮廓 + 揉皱纹理，空中滚动
      c.save(); c.translate(bx, by); c.scale(sx, sy);
      c.beginPath(); RIM.forEach((j, i) => { const a = i / RIM.length * Math.PI * 2, r = R * (.94 + j * .1); i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r); }); c.closePath();
      c.save(); c.shadowColor = 'rgba(60,50,30,.25)'; c.shadowBlur = 6; c.shadowOffsetY = 3; c.fillStyle = '#F4F0E6'; c.fill(); c.restore();
      c.save(); c.clip(); c.rotate(m.x * .02); c.drawImage(paper, -R * 1.3, -R * 1.3, R * 2.6, R * 2.6); c.restore();
      const sh = c.createRadialGradient(-8, -10, 4, 0, 0, R * 1.1); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(110,95,70,.28)'); c.fillStyle = sh; c.fill();
      c.strokeStyle = '#8C8373'; c.lineWidth = 1.6; c.stroke();
      // 脸：小眼睛 + 腮红
      const look = m.vx ? clamp(m.vx / 300, -1, 1) * 4 : 0, blink = (hash(Math.floor(t * 1.5)) > .7 && (t * 1.5) % 1 < .12) || landK > .6;
      c.fillStyle = '#1F1B16';
      [-8, 8].forEach(ex => { c.beginPath(); c.ellipse(ex + look, -3, 3.2, blink ? .8 : 4.4, 0, 0, Math.PI * 2); c.fill(); if (!blink) { c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + look + 1, -5, 1.1, 0, Math.PI * 2); c.fill(); c.fillStyle = '#1F1B16'; } });
      c.fillStyle = 'rgba(242,123,107,.45)'; [-15, 15].forEach(ex => { c.beginPath(); c.ellipse(ex + look, 6, 4, 2.5, 0, 0, Math.PI * 2); c.fill(); });
      c.strokeStyle = '#1F1B16'; c.lineWidth = 1.6; c.beginPath(); if (cheer || air) c.arc(look, 5, 4, 0, Math.PI); else c.arc(look, 3, 3.5, .2 * Math.PI, .8 * Math.PI); c.stroke();
      c.restore();
    }
  },
  score(S) {
    const { I, beat, bar } = S;
    // C – Am – F – G，马林巴 + 拨弦
    const PR = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]], RT = [48, 45, 41, 43];
    S.comp(PR, 0, 7, 'keys', .8, [0, 1.5, 2.5]);
    S.drums(1, 7, 'groove', .55);
    S.bassLine(RT, 1, 7, .6);
    for (let b = 1; b < 7; b++) [0, 1, 2, 3].forEach(k => S.at(b * bar + k * beat + beat / 2, I.pluck, PR[b % 4][k % 4] + 12, .35));
    // 纸团落下、每次起跳 / 落地
    S.at(DROP[0], I.whoosh, .6); S.at(DROP[1], I.paper); S.at(DROP[1], I.boing);
    MOVES.forEach(([a, b], i) => { S.at(a, I.jump); S.at(b, I.boop, 1 + (i % 3) * .15); S.at(b, I.paper); });
    JOY.forEach(j => { S.at(j, I.jump); S.at(j + .35, I.boop, 1.3); });
    // 排序
    S.at(GRAB, I.pop2); S.at(PUT, I.thud, .8); SORT_TICKS.forEach(x => S.at(x, I.tick, .8));
    // 筛选
    S.at(FBTN, I.click); S.at(FBTN + .05, I.swish); S.at(CHECK, I.click); S.at(CHECK + .05, I.pop); S.at(HIDE[0] + .1, I.swish);
    // 图表
    S.at(CBTN, I.click); S.at(CBTN + .02, I.pop, 1.3);
    BARS.forEach((x, i) => S.at(x, I.marimba, [72, 76, 79, 84][i]));
    STEP.forEach((x, i) => S.at(x, I.blip, 8 - i * 2));
    S.at(TOAST, I.ding);
    S.at(CAP, I.chime);
    S.at(14.0, (w, B) => [60, 64, 67, 72, 76].forEach(m => I.keys(w, B, m, 1, 1.4)));
  }
});
