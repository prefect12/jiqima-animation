<script src="../_engine/core.js"></script></head><body><script>
/* 木刻版画：黑是没刻掉的木面，白是刀刻掉的地方。天空、海、光全靠一道道刀痕的粗细表现明暗；
   只加一块暖黄套色版给“灯火”。动作按 12 帧/秒走，刀痕每 1/6 秒“重刻”一次，像逐帧刻出来的版画动画。

const BPM = 80, BEAT = 60 / BPM;
const T = {
  peel: [.1, .9], walk: [.9, 3.0], win: [3.75, 4.5], lamp: 5.25, beam: 6.0,

const IX = 24, IY = 24, IW = 1232, IH = 672, HOR = 400;
const LAMP = [1010, 140];
const TITLE = '"Noto Serif SC", "Songti SC", serif';

/* 初始化：木纹（印在黑色上的浅色纹路 + 漏墨白点）、纸纹 */
const GRAIN = document.createElement('canvas'); GRAIN.width = 640; GRAIN.height = 360;
{ const g = GRAIN.getContext('2d');
  for (let i = 0; i < 90; i++) { let y = Math.random() * 360; g.strokeStyle = `rgba(120,100,80,${.05 + Math.random() * .12})`; g.lineWidth = .6 + Math.random() * 1.8; g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 640; x += 20) { y += Math.random() * 2 - 1 + Math.sin(x / 90 + i) * .6; g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(236,228,210,${Math.random() * .35})`; g.fillRect(Math.random() * 640, Math.random() * 360, 1 + Math.random() * 1.5, 1); } }
const FIB = document.createElement('canvas'); FIB.width = FIB.height = 300;
{ const g = FIB.getContext('2d'); for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '90,70,50' : '255,252,240'},${Math.random() * .07})`; g.fillRect(Math.random() * 300, Math.random() * 300, 1 + Math.random() * 2, 1 + Math.random()); }
  for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(110,90,60,${Math.random() * .06})`; g.lineWidth = .5; g.beginPath(); let x = Math.random() * 300, y = Math.random() * 300; g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += Math.random() * 14 - 7; y += Math.random() * 14 - 7; g.lineTo(x, y); } g.stroke(); } }

// 一刀：两头尖、中间宽的柳叶形（加进当前路径，最后统一填色）
function gouge(c, x1, y1, x2, y2, w) { const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy); if (l < .5 || w <= .05) return; const nx = -dy / l * w, ny = dx / l * w, mx = (x1 + x2) / 2, my = (y1 + y2) / 2; c.moveTo(x1, y1); c.quadraticCurveTo(mx + nx, my + ny, x2, y2); c.quadraticCurveTo(mx - nx, my - ny, x1, y1); }

function gougeArc(c, x1, y1, x2, y2, w, bend) { const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy); if (l < .5 || w <= .05) return; const nx = -dy / l, ny = dx / l, mx = (x1 + x2) / 2, my = (y1 + y2) / 2; c.moveTo(x1, y1); c.quadraticCurveTo(mx + nx * (bend + w), my + ny * (bend + w), x2, y2); c.quadraticCurveTo(mx + nx * (bend - w), my + ny * (bend - w), x1, y1); }
const PATH = [[640, 700], [760, 664], [900, 640], [872, 590], [950, 560], [1004, 522]];   // 守灯人上山的小路
const BOATS = [{ hx: 380, dx: 190, seed: 1 }, { hx: 600, dx: 330, seed: 2 }, { hx: 250, dx: 470, seed: 3 }];

Film({
  title: '木刻版画 · 守灯人', DUR: 15, BPM, poster: 10.2,
  fonts: [['900 38px "Noto Serif SC"', '守灯人']],
  draw(c, tRaw, F) {
    const { W, H, prog, lerp, clamp, ease, easeOut, easeIn, hash } = F;

    const dawn = ease(prog(t, ...T.dawn));

    c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
    c.save(); c.beginPath(); c.rect(IX, IY, IW, IH); c.clip();

    carve(() => { for (let r = 0, y = IY + 6; y < HOR - 2; y += 8, r++) { const v = (y - IY) / (HOR - IY), w = .2 + 1.9 * Math.pow(v, 2.2) + dawn * (1.3 + 1.6 * v); let x = IX - 20 + 60 * hash(r); let k = 0; while (x < IX + IW + 20) { const len = 70 + 190 * hash(r * 31 + k), gap = 5 + 12 * hash(r * 17 + k * 3); gouge(c, x, y + jit(r * 50 + k, .8), x + len, y + jit(r * 50 + k + 1, .8), w * (.75 + .4 * hash(r + k * 7))); x += len + gap; k++; } } });

    const mx = 230, my = 120;
    carve(() => { c.moveTo(mx + 40, my); c.arc(mx, my, 40, 0, Math.PI * 2); });
    c.save(); c.beginPath(); c.arc(mx, my, 40, 0, Math.PI * 2); c.clip(); c.strokeStyle = INK; c.lineWidth = 2; for (let k = 0; k < 9; k++) { const x = mx + 8 + k * 4.2; c.beginPath(); c.moveTo(x, my - 44); c.lineTo(x + 3, my + 44); c.lineWidth = .6 + k * .45; c.stroke(); } c.restore();

    [[300, 92, 380, 0], [800, 60, 440, 1], [600, 214, 320, 2]].forEach(([cx, cy, w, i]) => {
      const x0 = cx + t * (5 + i * 2), h = w * .16, n = Math.round(w / 70), sw = w / n;
      const shape = () => { c.moveTo(x0 - w / 2, cy); c.bezierCurveTo(x0 - w / 2, cy - h * 1.4, x0 - w * .1, cy - h * 1.9, x0 + w * .1, cy - h * 1.3); c.bezierCurveTo(x0 + w * .3, cy - h * 1.8, x0 + w / 2 + 10, cy - h, x0 + w / 2, cy); for (let q = n - 1; q >= 0; q--) { const sx = x0 - w / 2 + q * sw + sw / 2; c.arc(sx, cy, sw / 2, 0, Math.PI, false); } c.closePath(); };
      c.beginPath(); shape(); c.fillStyle = INK; c.fill();
      if (dawn > 0) { c.save(); c.beginPath(); shape(); c.clip(); carve(() => { for (let y = cy - h * 2; y < cy + sw / 2; y += 7) gouge(c, x0 - w / 2 + 20 * hash(y), y, x0 + w / 2 - 20 * hash(y + 1), y + jit(y, 1), .2 + 1.5 * dawn * Math.max(0, (y - cy + h * 2) / (h * 2 + sw / 2))); }); c.restore(); }   // 天亮：云肚子里也刻出横线
      carve(() => {
        for (let q = 0; q < n; q++) { const sx = x0 - w / 2 + q * sw + sw / 2; [[1, 2.2], [.72, 1.4], [.46, .9]].forEach(([k, ww]) => { for (let s2 = 0; s2 < 3; s2++) { const a0 = .15 + s2 * .98, a1 = a0 + .86; gougeArc(c, sx + Math.cos(a0) * sw / 2 * k, cy + Math.sin(a0) * sw / 2 * k, sx + Math.cos(a1) * sw / 2 * k, cy + Math.sin(a1) * sw / 2 * k, ww + dawn, -sw * k * .12); } }); }
        gougeArc(c, x0 - w * .42, cy - h * 1.15, x0 + w * .06, cy - h * 1.45, 1.2 + dawn, -h * .5); gougeArc(c, x0 + w * .14, cy - h * 1.35, x0 + w * .46, cy - h * .7, 1.1 + dawn, -h * .4);

    c.fillStyle = INK; c.fillRect(IX, HOR, IW, IH);
    carve(() => {
      gouge(c, IX - 10, HOR, IX + IW + 10, HOR, 1.4);                                   // 海平线
      const N = 24;
      for (let k = 0; k < N; k++) {
        const v = k / (N - 1), y = HOR + 10 + 300 * Math.pow(v, 1.55), amp = 1.5 + 9 * Math.pow(v, 1.3), lam = 30 + 120 * v, w0 = .45 + 2.4 * v + dawn * (.9 + 1.6 * v);
        const off = ((t * (14 + 40 * v) + k * 37) % lam), n = Math.ceil(960 / lam) + 2;
        for (let q = -1; q < n; q++) { const xc = IX + q * lam + off + (k % 2) * lam * .5 + jit(k * 90 + q, 4), L = lam * (.42 + .25 * hash(k * 13 + q)); if (xc > 920 + 30 * v) break; const moon = Math.max(0, 1 - Math.abs(xc - mx) / (70 + 140 * v)); gougeArc(c, xc - L / 2, y + jit(k * 40 + q, 1.2), xc + L / 2, y + jit(k * 40 + q + 3, 1.2), w0 * (.7 + .5 * hash(k * 5 + q)) * (1 + 1.4 * moon), -amp * .8); }
      }
    });
    // 灯光：两道光束绕着转，一边扫过海面
    if (lampOn > 0 && t >= T.beam - .5) {
      const phi = (t - T.beam) * 1.5 + Math.PI / 2 * 0, len = 1100;
      [0, Math.PI].forEach(o => {
        const a = phi + o, cx = Math.cos(a), toward = Math.sin(a);
        if (Math.abs(cx) < .05) return;
        const L = len * Math.abs(cx) * lampOn, dir = Math.sign(cx), tilt = .09, spread = .075 + .05 * Math.max(0, toward);
        const ang = dir > 0 ? tilt : Math.PI - tilt;
        c.save(); c.beginPath(); c.moveTo(LAMP[0], LAMP[1]); c.lineTo(LAMP[0] + Math.cos(ang - spread) * L, LAMP[1] + Math.sin(ang - spread) * L); c.lineTo(LAMP[0] + Math.cos(ang + spread) * L, LAMP[1] + Math.sin(ang + spread) * L); c.closePath(); c.clip();
        c.fillStyle = PAPER; c.fillRect(IX, IY, IW, IH);
        c.strokeStyle = INK; for (let k = -6; k <= 6; k++) { const aa = ang + k / 6 * spread; c.lineWidth = .6 + Math.abs(k) * .35; c.beginPath(); c.moveTo(LAMP[0] + Math.cos(aa) * 60, LAMP[1] + Math.sin(aa) * 60); c.lineTo(LAMP[0] + Math.cos(aa) * L, LAMP[1] + Math.sin(aa) * L); c.stroke(); }
        c.restore();
      });
    }
    // ---------- 码头 + 船 ----------
    c.fillStyle = INK; c.fillRect(40, 584, 520, 14);
    for (let k = 0; k < 9; k++) c.fillRect(52 + k * 62, 596, 9, 80);
    carve(() => { gouge(c, 36, 584, 564, 583, 1.8); for (let k = 0; k < 26; k++) gouge(c, 44 + k * 20, 591, 60 + k * 20, 591 + jit(k + 300, 1), 1.3); for (let k = 0; k < 9; k++) { gouge(c, 53 + k * 62, 600, 53 + k * 62, 676, 1.3); for (let q = 0; q < 3; q++) gouge(c, 58 + k * 62, 612 + q * 22, 60 + k * 62, 624 + q * 22, 1.2); } });
    const boats = BOATS.map((b, i) => { const t1 = T.dock[i], t0 = t1 - T.sail - i * .3, u = clamp((t - t0) / (t1 - t0), 0, 1), e = 1 - Math.pow(1 - u, 2.2); return { ...b, i, u, x: lerp(b.hx, b.dx, e), y: lerp(HOR + 6, 612, Math.pow(e, 1.4)), s: lerp(.26, 1.2, Math.pow(e, 1.3)), vis: t >= t0, docked: u >= 1 }; }).filter(b => b.vis).sort((a, b) => a.y - b.y);
    boats.forEach(b => {
      const bob = Math.sin(t * 2.4 + b.seed) * 3 * b.s, s = b.s;
      c.save(); c.translate(b.x, b.y + bob); c.scale(s, s); c.rotate(Math.sin(t * 1.8 + b.seed) * .04);
      if (!b.docked) carve(() => { for (let k = 1; k < 5; k++) { gouge(c, 70 + k * 26, 8 + k * 3, 90 + k * 30, 12 + k * 5, 1.6); gouge(c, 70 + k * 26, 8 - k * 1, 94 + k * 30, 6 - k * 1, 1.2); } });
      c.fillStyle = INK; c.beginPath(); c.moveTo(-80, -6); c.lineTo(80, -10); c.quadraticCurveTo(70, 14, 40, 16); c.lineTo(-58, 16); c.quadraticCurveTo(-76, 10, -80, -6); c.closePath(); c.fill();
      c.fillRect(-3, -110, 5, 104);
      carve(() => { gouge(c, -80, -7, 80, -11, 2.2); gougeArc(c, -60, 17, 42, 17, 2, 3); gouge(c, -70, 2, 64, -2, 1.6); gouge(c, -60, 9, 52, 7, 1.2); c.moveTo(4, -104); c.lineTo(60, -16); c.lineTo(4, -16); c.closePath(); for (let k = 0; k < 4; k++) gouge(c, -16 + jit(k + b.seed * 9, 3), 26 + k * 9, -12 + jit(k + b.seed * 9 + 1, 3), 31 + k * 9, 1.4 - k * .2); });
      c.strokeStyle = INK; for (let k = 0; k < 6; k++) { c.lineWidth = .8 + k * .3; c.beginPath(); c.moveTo(12 + k * 8, -86 + k * 12); c.lineTo(12 + k * 8, -18); c.stroke(); }
      spot(() => { c.moveTo(-8, -58); c.arc(-14, -58, 7, 0, Math.PI * 2); });
      carve(() => { for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; gouge(c, -14 + Math.cos(a) * 11, -58 + Math.sin(a) * 11, -14 + Math.cos(a) * 20, -58 + Math.sin(a) * 20, 1.2); } });
      c.restore();
    });
    // ---------- 崖和灯塔 ----------
    const cliff = [[840, 720], [868, 610], [900, 566], [960, 530], [1000, 520], [1100, 516], [1170, 478], [1260, 452], [1260, 720]];
    c.fillStyle = INK; c.beginPath(); cliff.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill();
    carve(() => {
      for (let k = 0; k < cliff.length - 2; k++) gouge(c, cliff[k][0], cliff[k][1] + 3, cliff[k + 1][0], cliff[k + 1][1] + 3, 2.2);
      for (let k = 0; k < 110; k++) { const u = hash(k + 500), v = hash(k + 600), x = lerp(870, 1250, u), top = x < 1000 ? lerp(610, 520, (x - 868) / 132) : x < 1170 ? lerp(520, 478, (x - 1000) / 170) : lerp(478, 452, (x - 1170) / 90), y = top + 12 + v * (700 - top), a = -.5 + hash(k + 700) * .5; gouge(c, x, y, x + Math.cos(a) * (18 + 26 * v), y + Math.sin(a) * (18 + 26 * v), 1.2 + 1.8 * (1 - v)); }
      for (let k = 0; k < PATH.length - 1; k++) { const [x1, y1] = PATH[k], [x2, y2] = PATH[k + 1]; for (let q = 0; q < 6; q++) { const a = q / 6, b = (q + .6) / 6; gouge(c, lerp(x1, x2, a), lerp(y1, y2, a), lerp(x1, x2, b), lerp(y1, y2, b), 2.6); } }
      const sp = (Math.sin(t * 3.1) + 1) / 2; for (let k = 0; k < 7; k++) { const a = -Math.PI * (.35 + .5 * k / 6), r0 = 8, r1 = 16 + 22 * sp * hash(k + bf); gougeArc(c, 862 + Math.cos(a) * r0, 616 + Math.sin(a) * r0, 862 + Math.cos(a) * r1, 616 + Math.sin(a) * r1, 1.5, -3); }
    });
    // 塔身：白塔（刻空），右侧留黑排线，两道黑环
    const tw = y => lerp(55, 35, (520 - y) / 342);
    c.fillStyle = PAPER; c.beginPath(); c.moveTo(1010 - tw(520), 520); c.lineTo(1010 - tw(178), 178); c.lineTo(1010 + tw(178), 178); c.lineTo(1010 + tw(520), 520); c.closePath(); c.fill();
    c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
    c.save(); c.clip(); for (let k = 0; k < 14; k++) { const f = k / 13; c.lineWidth = .5 + f * f * 4.2; c.beginPath(); c.moveTo(1012 + k * 3.6, 520); c.lineTo(1012 + k * 2.4, 178); c.stroke(); }
    [[300, 330], [420, 452]].forEach(([a, b]) => { c.fillStyle = INK; c.fillRect(900, a, 220, b - a); }); c.restore();
    carve(() => { [[300, 330], [420, 452]].forEach(([a, b]) => { for (let y = a + 6; y < b - 2; y += 7) gouge(c, 1010 - tw(y) + 4, y, 1010 + 4, y + jit(y, 1), .9); }); });
    // 窗：由下往上亮

      c.fillStyle = INK; c.beginPath(); c.roundRect(1002, y - 14, 16, 26, [8, 8, 0, 0]); c.fill();
      if (t >= on) { spot(() => { c.roundRect(1005, y - 10, 10, 19, [5, 5, 0, 0]); }); carve(() => { for (let k = 0; k < 6; k++) { const a = Math.PI + k / 5 * Math.PI; gouge(c, 1010 + Math.cos(a) * 16, y + Math.sin(a) * 18, 1010 + Math.cos(a) * 26, y + Math.sin(a) * 30, 1); } }); }
    });
    // 门（守灯人进门时透出暖光）
    c.fillStyle = INK; c.beginPath(); c.roundRect(996, 482, 28, 38, [14, 14, 0, 0]); c.fill();
    if (t > T.walk[1] - .3 && t < T.win[0]) spot(() => c.roundRect(1000, 488, 20, 32, [10, 10, 0, 0]));

    c.fillStyle = INK; c.fillRect(952, 170, 116, 10); c.fillRect(956, 146, 108, 3); for (let k = 0; k <= 9; k++) c.fillRect(957 + k * 11.6, 146, 2.4, 24);
    c.fillRect(976, 104, 68, 44);

    } else { carve(() => { for (let k = 0; k < 4; k++) gouge(c, 986 + k * 16, 110, 986 + k * 16, 142, 1.2); }); }
    c.fillStyle = INK; c.beginPath(); c.moveTo(968, 106); c.quadraticCurveTo(1010, 52, 1052, 106); c.closePath(); c.fill(); c.fillRect(1007, 50, 6, 16);
    carve(() => gouge(c, 984, 98, 1004, 72, 1.6));
    // ---------- 守灯人 ----------
    const keeper = (x, y, ph, wave = 0, lantern = true, sc = 1.5) => {
      const body = (col, e) => {
