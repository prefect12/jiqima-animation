/* 情景喜剧卡通：固定客厅机位、粗黑描边平涂、夸张表情、罐头笑声。
   时间全部按拍（120 BPM，一拍 0.5 秒）定义，画面和 score() 共用。 */
const BPM = 120, BEAT = 60 / BPM;
const T_ROOM = 3 * BEAT, T_ON = 5 * BEAT, T_SPOT = 12 * BEAT, T_PULL = 13 * BEAT, T_WAKE = 14 * BEAT,
  T_SHOCK = 15 * BEAT, T_BONK = 21 * BEAT, T_LAND = 22 * BEAT, T_MEOW = 24 * BEAT, T_FREEZE = 27 * BEAT;
const OL = '#1B1612', FONT = '"ZCOOL KuaiLe", "PingFang SC", sans-serif';
const CAT = [842, 612];                               // 猫睡觉的位置（地毯上）
const sm = u => u * u * (3 - 2 * u);
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a), 0, 1);
// 扫地机器人路线：前半段走走停停（关键帧），后半段驮着猫满屋乱窜（样条）
const ROAM = [[0, 300, 628], [T_ON + .15, 300, 628], [3.3, 470, 676], [3.6, 470, 676], [4.3, 392, 574], [4.55, 392, 574], [5.3, 600, 594], [5.5, 600, 594], [T_SPOT, 700, 634]];
const RIDE = [[700, 634], [890, 664], [1075, 620], [985, 548], [725, 566], [430, 648], [212, 606], [300, 540], [520, 530]];

  let i = list.findIndex(k => k[0] > t); if (i < 0) return list[list.length - 1].slice(1); if (i === 0) return list[0].slice(1);

}
function spline(P, u) {
  const n = P.length - 1, f = Math.min(n - 1e-6, Math.max(0, u) * n), i = Math.floor(f), s = f - i;

// 地上的饼干渣：沿机器人前半段路线撒，机器人经过时被吃掉
const CRUMBS = [];

Film({

    c.fillStyle = '#86CDB9'; c.fillRect(-20, -20, W + 40, 490);
    c.fillStyle = '#78BFAB'; for (let x = 0; x < W; x += 72) c.fillRect(x, 26, 30, 424);

    line([[170, 92], [170, 322]], 6); line([[70, 207], [270, 207]], 6);
    c.beginPath(); c.moveTo(56, 92); c.lineTo(110, 92); c.lineTo(84, 330); c.lineTo(50, 330); c.closePath(); fs('#E8483B', 5);
    c.beginPath(); c.moveTo(284, 92); c.lineTo(230, 92); c.lineTo(256, 330); c.lineTo(290, 330); c.closePath(); fs('#E8483B', 5);
    c.beginPath(); c.rect(40, 80, 260, 16); fs('#8A5A36', 5);
    // 墙上的画（画的是一条鱼，给猫的伏笔）
    c.save(); c.translate(640, 118); c.rotate(.03);
    c.beginPath(); c.rect(-86, -58, 172, 116); fs('#FFD95A', 7); c.beginPath(); c.rect(-68, -42, 136, 84); fs('#FFF7E4', 4);
    ell(-6, 0, 36, 20); fs('#5AA9E6', 4); c.beginPath(); c.moveTo(26, 0); c.lineTo(52, -18); c.lineTo(52, 18); c.closePath(); fs('#5AA9E6', 4); ell(-24, -4, 4, 4); c.fillStyle = OL; c.fill();
    c.restore();

    c.beginPath(); c.moveTo(1100, 150); c.lineTo(1180, 150); c.lineTo(1200, 226); c.lineTo(1080, 226); c.closePath(); fs('#FFD95A', 6);
    line([[1140, 226], [1140, 452]], 7); ell(1140, 456, 36, 9); fs('#8A5A36', 5);
    // 踢脚线 + 地板
    c.fillStyle = '#D9914F'; c.fillRect(-20, 470, W + 40, 270);
    for (let r = 0; r < 7; r++) { const y = 470 + r * 38 + r * r * 2; line([[-20, y], [W + 20, y]], 3, '#B9713A'); for (let k = 0; k < 7; k++) { const x = ((k * 230 + r * 117) % 1400) - 60; line([[x, y], [x, y + 38 + r * 4]], 3, '#B9713A'); } }

    ell(770, 628, 330, 70); fs('#E8483B', 6); ell(770, 628, 280, 52); c.lineWidth = 6; c.strokeStyle = '#FFD95A'; c.stroke();

    function mouth(x, y, cfg) {
      const { shockK = 0, mood = 'smile', w = 30 } = cfg;
      if (shockK > .05) {                                  // 下巴掉下来
        const h = 12 + 44 * shockK; c.beginPath(); c.ellipse(x, y + h * .5, 22 + 6 * shockK, h, 0, 0, P * 2); fs('#7A1E1E', 5);

      }

    }
    const moodAt = who => {
      if (t < T_SPOT) return 'smile';
      if (t < T_SHOCK) return 'curious';
      if (t < T_LAND) return 'shock';

    function dad(x, y) {

      c.beginPath(); F.rrect(c, x - 60, y - 66, 120, 136 + jaw, 40); fs('#F1C29B');

      c.beginPath(); F.rrect(c, x - 60, y - 66, 120, 136 + jaw, 40); c.lineWidth = 6; c.strokeStyle = OL; c.stroke();

      if (sk > .1) { line([[x - 50, y - 70 - lift + 30], [x - 60, y - 40]], 4); line([[x + 50, y - 70 - lift + 30], [x + 60, y - 40]], 4); }

    }

    function kid(x, y) {

      c.beginPath(); c.moveTo(x - 62, 455); c.lineTo(x - 54, y + 76); c.quadraticCurveTo(x, y + 62, x + 54, y + 76); c.lineTo(x + 62, 455); c.closePath(); fs('#3F7FD1');
