    if (ea > 0) { c.save(); c.globalAlpha = ea; line(1.4, 1, [6, 5]); [[CX + 300, TOP - 90, TOP - 20], [CX - 300, TOP - 90, TOP - 20]].forEach(([x, y0, y1]) => { c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke(); c.setLineDash([]); arrow(x, y1 + 4, Math.PI / 2); c.setLineDash([6, 5]); });

      if (u > .6) txt('Ø1100', CX + 150, y - 14, `500 18px ${MONO}`, 'center', prog(u, .6, 1)); c.restore(); }

      if (u > .6) txt('66°', CX + Math.cos(Math.PI / 2 - TH_OPEN / 2) * 178, TOP + Math.sin(Math.PI / 2 - TH_OPEN / 2) * 178, `500 18px ${MONO}`, 'center', prog(u, .6, 1)); c.restore(); }

      txt('序号', 977, 66, `500 13px ${ZH}`, 'center', .8); txt('名称', 1040, 66, `500 13px ${ZH}`, 'center', .8); txt('材料', 1137, 66, `500 13px ${ZH}`, 'center', .8); txt('数量', 1218, 66, `500 13px ${ZH}`, 'center', .8);

        let stop = 700;

        if (yy < stop) { if (yy > 36) { line(1.5, .78); c.beginPath(); c.moveTo(xs, yy); c.lineTo(xs + 4, yy - 26); c.stroke(); } }
        else if (over) { const k = (yy - stop) / sp; if (k < .16) { const e = k / .16, sx = x0 + hash(cyc * 13.7 + i) * 40 - stop * .16; line(1.3, .85 * (1 - e)); for (const s of [-1, 1]) { c.beginPath(); c.moveTo(sx + s * 2, stop - 1); c.lineTo(sx + s * (3 + 9 * e), stop - 3 - 8 * Math.sin(e * Math.PI)); c.stroke(); } } }
      }
      // drips off the rib tips
      [Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, 0, Math.PI].forEach((phi, k) => {
        const p = ribPt(phi, 1, 1), per = .5, ph = (t - RAIN - .6 - k * .13); if (ph < 0) return; const f = (ph % per) / per;
        line(1.4, .8); c.beginPath(); c.moveTo(p[0], p[1] + 6 + f * 230); c.lineTo(p[0], p[1] + 14 + f * 230); c.stroke();
      });
    }

    // ---------- stamp ----------
    if (t > STAMP) {
      const k = easeOut(prog(t, STAMP, STAMP + .14)), s = lerp(1.7, 1, k);
      c.save(); c.translate(1103, 420); c.rotate(-.12); c.scale(s, s); c.globalAlpha = Math.min(1, k * 1.3) * .92;
      c.strokeStyle = '#FFD7A8'; c.lineWidth = 3.5; rrect(c, -118, -46, 236, 92, 10); c.stroke(); c.lineWidth = 1.4; rrect(c, -108, -37, 216, 74, 6); c.stroke();
      c.fillStyle = '#FFD7A8'; c.font = `700 32px ${ZH}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('装配完成', 0, -6);
      c.font = `600 13px ${MONO}`; c.fillText('ASSEMBLED · QC PASS', 0, 24);
      c.fillStyle = BG; for (let i = 0; i < 70; i++) { c.beginPath(); c.arc(-118 + hash(i * 3.1) * 236, -46 + hash(i * 7.3) * 92, .8 + hash(i * 1.7) * 1.8, 0, 7); c.fill(); }
      c.restore();
    }
    // plotter crosshair at the pen tip
    if (tip) { line(1, .9); c.beginPath(); c.moveTo(tip[0] - 10, tip[1]); c.lineTo(tip[0] + 10, tip[1]); c.moveTo(tip[0], tip[1] - 10); c.lineTo(tip[0], tip[1] + 10); c.stroke(); c.beginPath(); c.arc(tip[0], tip[1], 4, 0, 7); c.stroke(); }
    F.grain(c, t, .045);
    F.vignette(c, .35, '4,14,32');
    const fo = prog(t, OUT, 15); if (fo > 0) { c.fillStyle = `rgba(9,30,58,${fo})`; c.fillRect(0, 0, W, H); }
  },
  score(S) {
    const { I, beat, bar } = S;
    const NB = new WeakMap();
    const nbuf = ctx => { let b = NB.get(ctx); if (!b) { b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; NB.set(ctx, b); } return b; };
    const burst = (w, B, d, peak, type, f, q = 1, a = .002, dst = 'sfx') => { const X = B.sfx.context, s = X.createBufferSource(); s.buffer = nbuf(X); const fl = X.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = X.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + a); g.gain.exponentialRampToValueAtTime(.0001, w + a + d); s.connect(fl); fl.connect(g); g.connect(B[dst]); s.start(w, Math.random()); s.stop(w + a + d + .05); };
    const tone = (w, B, type, f, d, peak, f2) => { const X = B.sfx.context, o = X.createOscillator(), g = X.createGain(); o.type = type; o.frequency.setValueAtTime(f, w); if (f2) o.frequency.exponentialRampToValueAtTime(f2, w + d); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + .002); g.gain.exponentialRampToValueAtTime(.0001, w + d); o.connect(g); g.connect(B.sfx); o.start(w); o.stop(w + d + .05); };
    // mechanical sounds
    const ratchet = (w, B) => { for (let i = 0; i < 4; i++) burst(w - .06 + i * .02, B, .012, .22, 'bandpass', 3600, 6); burst(w, B, .05, .35, 'bandpass', 1200, 3); tone(w, B, 'sine', 180, .12, .35, 90); };
    const clack = (w, B, p = 1) => { burst(w, B, .06, .5, 'bandpass', 900 * p, 2); tone(w, B, 'triangle', 240 * p, .09, .3, 120 * p); burst(w + .03, B, .02, .15, 'highpass', 5000, 1); };
    const plotter = (w, B, d) => { const X = B.sfx.context, o = X.createOscillator(), g = X.createGain(), fl = X.createBiquadFilter(); o.type = 'square'; o.frequency.setValueAtTime(95, w); o.frequency.linearRampToValueAtTime(140, w + d); fl.type = 'bandpass'; fl.frequency.value = 1400; fl.Q.value = 2; g.gain.setValueAtTime(.0001, w); g.gain.linearRampToValueAtTime(.06, w + .03); g.gain.setValueAtTime(.06, w + d - .04); g.gain.linearRampToValueAtTime(.0001, w + d); o.connect(fl); fl.connect(g); g.connect(B.sfx); o.start(w); o.stop(w + d + .05); };
    const zip = (w, B) => { const X = B.sfx.context, s = X.createBufferSource(); s.buffer = nbuf(X); const fl = X.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 5; fl.frequency.setValueAtTime(800, w); fl.frequency.exponentialRampToValueAtTime(5000, w + .3); const g = X.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.12, w + .05); g.gain.exponentialRampToValueAtTime(.0001, w + .32); s.connect(fl); fl.connect(g); g.connect(B.sfx); s.start(w); s.stop(w + .4); };
    const rainBed = (w, B) => { const X = B.sfx.context, s = X.createBufferSource(); s.buffer = nbuf(X); s.loop = true; const hp = X.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900; const lp = X.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000; const g = X.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.2, w + 1); g.gain.setValueAtTime(.2, w + 3.3); g.gain.exponentialRampToValueAtTime(.0001, w + 4.5); s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(B.sfx); s.start(w); s.stop(w + 4.6); };
    // music: minimal electronic, A minor, 120 BPM
    const PR = [[57, 64, 69, 72], [53, 60, 65, 69], [48, 55, 60, 64], [55, 62, 67, 71]], RT = [33, 29, 36, 31];
    S.padBars(PR, 0, 8, 'pad', .7);
    for (let b = 0; b < 7; b++) { const t0 = b * bar, r = RT[b % 4]; for (let k = 0; k < 4; k++) S.at(t0 + k * beat, I.subbass, r + 12, .3, .8); if (b >= 1) { for (let k = 0; k < 4; k++) S.at(t0 + k * beat, I.kick, .55); for (let e = 0; e < 8; e++) if (e % 2) S.at(t0 + e * beat / 2, I.hat, .7); } }
    // sixteenth arpeggio from the dimension section on
    for (let x = DIMS[0]; x < 14; x += beat / 2) { const b = Math.floor(x / bar), ch = PR[b % 4]; S.at(x, I.pluck, ch[Math.round(x / (beat / 2)) % 4] + 12, .35); }
    S.at(0, I.thud, .6); S.at(.1, (w, B) => plotter(w, B, .7));
    S.at(T_SHAFT, (w, B) => plotter(w, B, .45));
    S.at(T_RIBS, (w, B) => plotter(w, B, .45));
    OPEN.forEach(x => S.at(x, ratchet));
    DIMS.forEach(x => { S.at(x, zip); S.at(x + .4, I.tick, 1.4); });
    PARTS.forEach(p => S.at(p[4] + .3, I.tick, 1));
    EXP.forEach(x => S.at(x, (w, B) => plotter(w, B, .45)));
    ASM.forEach((x, i) => { S.at(x - .3, I.swish); S.at(x, clack, [1, 1.4, .8][i]); });
    S.at(STAMP, I.thud, 1.2); S.at(STAMP, I.impact);
    S.at(RAIN - .2, rainBed);
    for (let i = 0; i < 60; i++) S.at(RAIN + .4 + i * .061 + (i * 37 % 7) * .007, (w, B) => burst(w, B, .02, .05 + (i % 5) * .012, 'bandpass', 2400 + (i * 53 % 9) * 300, 3));
    S.at(12.5, (w, B) => [57, 64, 69, 71, 76].forEach(m => I.keys(w, B, m, .9, 2.4)));
    S.at(OUT - .1, (w, B) => [45, 57, 64, 69].forEach(m => I.keys(w, B, m, .8, 1.2)));
  }
});
