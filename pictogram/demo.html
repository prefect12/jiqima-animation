<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>象形图形运动 · 铁人三项</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@900&display=swap">
<script src="../_engine/core.js"></script></head><body><script>
const BPM = 128, BEAT = 60 / BPM;              // 0.469 s — one pose per beat, 32 beats in 15 s

const BK = { rh: [505, 452], ff: [705, 452], bb: [600, 452], seat: [588, 366], ht: [684, 378], bar: [700, 352], r: 56, crank: 22 };

Film({
  title: '象形图形运动 · 铁人三项', DUR: 15, BPM, poster: 10.2,
  fonts: [['900 80px "Noto Sans SC"', '铁人三项游泳骑车跑步完赛！'], ['40px "Archivo Black"', 'TRIATHLON SWIM BIKE RUN KM 0123456789. FINISH']],
  draw(c, t, F) {

    // scene wipe: the new colour slides in as a slanted block on the scene's first beat

    if (scene !== 'intro' && sb === 0 && ph < .5) { const u = easeOut(ph / .5), x = lerp(-200, W + 400, u); c.save(); c.beginPath(); c.moveTo(x, 0); c.lineTo(W + 400, 0); c.lineTo(W + 400, H); c.lineTo(x - 240, H); c.closePath(); c.fillStyle = THEME[prevOf[scene]].bg; c.fill(); c.restore(); }

    const lerpPose = (A, B, u) => { const o = {}; for (const k in A) o[k] = A[k] + (B[k] - A[k]) * u; return o; };

    } else if (bike) {
      // bike: wheels, frame, crank — the crank snaps 90° per beat
      const wr = crankA * 2.4;
      [BK.rh, BK.ff].forEach(w => { c.strokeStyle = FIG; c.lineWidth = 11; c.beginPath(); c.arc(w[0], w[1], BK.r, 0, 7); c.stroke(); c.lineWidth = 4; for (let k = 0; k < 3; k++) { const a = (wr + k * 60) * Math.PI / 180; c.beginPath(); c.moveTo(w[0] - Math.cos(a) * BK.r, w[1] - Math.sin(a) * BK.r); c.lineTo(w[0] + Math.cos(a) * BK.r, w[1] + Math.sin(a) * BK.r); c.stroke(); } c.beginPath(); c.arc(w[0], w[1], 7, 0, 7); c.fillStyle = FIG; c.fill(); });
      const hipB = [BK.seat[0] + 2, BK.seat[1] - 10];
      const pedal = k => { const a = (crankA + k * 180) * Math.PI / 180; return [BK.bb[0] + Math.cos(a) * BK.crank, BK.bb[1] + Math.sin(a) * BK.crank]; };
      const bob = 3 * Math.sin(Math.PI * clamp(ph * 1.5, 0, 1));
      const hip = [hipB[0], hipB[1] - bob], neck = add(hip, 124, LIMB.torso), head = add(hip, 124, LIMB.torso + LIMB.head + 9), sho = add(hip, 124, LIMB.torso - 8);
      const L2 = ik(hip, pedal(1), LIMB.th, LIMB.sh, -1), L1 = ik(hip, pedal(0), LIMB.th, LIMB.sh, -1);
      const A2 = ik(sho, [BK.bar[0] - 4, BK.bar[1] + 2], LIMB.ua, LIMB.fa, 1), A1 = ik(sho, BK.bar, LIMB.ua, LIMB.fa, 1);
      // far pedal leg behind the frame
      cap(L2, 21 + G * 2, BG); cap(L2, 21, backCol);
      cap([BK.rh, BK.bb, BK.seat, BK.rh], 10, FIG); cap([BK.seat, BK.ht, BK.bb], 10, FIG); cap([BK.ht, BK.ff], 10, FIG); cap([BK.ht, BK.bar, [BK.bar[0] + 16, BK.bar[1] + 18]], 9, FIG);
      c.beginPath(); c.arc(BK.bb[0], BK.bb[1], 12, 0, 7); c.fillStyle = FIG; c.fill();
      cap([BK.bb, pedal(0)], 7, BG); cap([[BK.seat[0] - 22, BK.seat[1] - 2], [BK.seat[0] + 16, BK.seat[1] - 2]], 10, FIG);
      drawRig(hip, neck, head, A1, A2, L1, null, 4, 1);
      // speed ticks
      c.strokeStyle = FIG; c.lineWidth = 6; c.lineCap = 'round'; const sp = ph < .35 ? 1 - ph / .35 : 0; if (sp > 0) [[400, 330], [370, 400], [410, 470]].forEach(([x, y], i) => { c.globalAlpha = sp; c.beginPath(); c.moveTo(x - 40 * sp - i * 10, y); c.lineTo(x, y); c.stroke(); }); c.globalAlpha = 1;
    } else {
      figure(pose);
      if (scene === 'run') { c.strokeStyle = FIG; c.lineWidth = 6; c.lineCap = 'round'; const sp = ph < .35 ? 1 - ph / .35 : 0; if (sp > 0) [[-120, -70], [-150, -10], [-115, 50]].forEach(([x, y], i) => { c.globalAlpha = sp; c.beginPath(); c.moveTo(x - 40 * sp - i * 10, y); c.lineTo(x, y); c.stroke(); }); c.globalAlpha = 1; }
    }
    c.restore();
    {
      if (scene === 'swim') {
        // water surface drawn over the lower half of the swimmer
        c.save(); c.globalAlpha = .55; c.fillStyle = '#1769C2'; c.beginPath(); c.moveTo(0, 458); for (let x = 0; x <= W; x += 20) c.lineTo(x, 458 + 6 * Math.sin(x * .03 - S * 2)); c.lineTo(W, H); c.lineTo(0, H); c.fill(); c.restore();
        c.strokeStyle = '#FFFFFF'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); for (let x = 0; x <= W; x += 20) c.lineTo(x, 458 + 6 * Math.sin(x * .03 - S * 2)); c.stroke();
        // splash dots where the hand enters, one burst per beat
        const hx = 560 + 150 * 2.2, sp = clamp(ph / .5, 0, 1); if (sp < 1) for (let k = 0; k < 6; k++) { const a = Math.PI + .25 + k * .53; c.beginPath(); c.arc(hx + Math.cos(a) * 80 * sp, 452 + Math.sin(a) * 70 * sp, 13 * (1 - sp), 0, 7); c.fillStyle = '#FFFFFF'; c.fill(); }
      }
      if (scene === 'finish') {
        // tape snaps on the first finish beat, then confetti on beat 30
        const u = sb === 0 ? clamp(ph / .4, 0, 1) : 1;
        c.strokeStyle = '#E4572E'; c.lineWidth = 8; c.lineCap = 'round';
        c.lineWidth = 12; c.beginPath(); c.moveTo(560, 420); c.quadraticCurveTo(lerp(700, 560, u), lerp(430, 540, u), lerp(820, 590, u), lerp(420, 600, u)); c.stroke();
        c.beginPath(); c.moveTo(1080, 420); c.quadraticCurveTo(lerp(940, 1080, u), lerp(430, 540, u), lerp(820, 1050, u), lerp(420, 600, u)); c.stroke();
        c.fillStyle = '#15151C'; c.fillRect(546, 400, 16, 216); c.fillRect(1074, 400, 16, 216);
        if (sb >= 2) { const k = t - (SC.finish + 2) * BEAT; for (let i = 0; i < 46; i++) { const a = hash(i) * Math.PI * 2, v = 260 + hash(i * 3) * 380, x = 820 + Math.cos(a) * (70 + v * k * .9), y = 230 + Math.sin(a) * (50 + v * k * .6) - 260 * k + 560 * k * k; c.save(); c.translate(x, y); c.rotate(k * 6 + i); c.fillStyle = ['#15151C', '#E4572E', '#1E7FE0', '#2FA35B', '#FFFFFF'][i % 5]; c.fillRect(-10, -6, 20, 12); c.restore(); } }
      }

    c.textBaseline = 'alphabetic';
    const slam = (s, x, y, size, col, t0, font = CN, align = 'left') => { if (t < t0) return; const k = easeOut(prog(t, t0, t0 + .12)), sc = lerp(1.6, 1, k); c.save(); c.globalAlpha = Math.min(1, k * 2); c.translate(x, y); c.scale(sc, sc); c.font = `900 ${size}px ${font}`; c.textAlign = align; c.fillStyle = col; c.fillText(s, 0, 0); c.restore(); };
    if (scene === 'intro') { slam('铁人三项', 90, 350, 120, '#FFFFFF', 2 * BEAT, CN); slam('TRIATHLON', 94, 420, 40, '#FFC93C', 3 * BEAT, EN); }
    if (LABEL[scene]) {
      const [n, zh, en] = LABEL[scene], t0 = SC[scene] * BEAT;
      slam(n, 70, 150, 64, FIG, t0, EN); slam(zh, 70, 238, 76, FIG, t0 + BEAT * .5, CN); slam(en, 72, 282, 24, FIG, t0 + BEAT, EN);

  },
  score(S) {
    const { I, beat, bar } = S;
    const NB = new WeakMap();
    const nbuf = X => { let b = NB.get(X); if (!b) { b = X.createBuffer(1, X.sampleRate, X.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; NB.set(X, b); } return b; };

});
