{ let x = T_INTRO; GAMES.forEach((g, i) => { g.t0 = x; x += g.len; if (i < 4) { g.tEnd = x; x += GAPS[i]; } else g.tEnd = x; }); }

      c.beginPath(); rrect(c, -38, -300, 76, 300, 36); fs('#FFD9B8'); c.beginPath(); rrect(c, -90, -420, 180, 170, 60); fs('#FFD9B8'); c.beginPath(); rrect(c, -100, -520, 200, 110, 20); fs('#23C9FF');
      c.beginPath(); c.moveTo(-18, -34); c.quadraticCurveTo(0, -14, 18, -34); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); c.restore(); c.restore();

      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-40 + k * 12, 10 + k * 40); c.lineTo(-10 + k * 12, 14 + k * 40); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); }

      if (!snapped) leaves(640 + wob, 440 - (u > .38 ? 16 * pr(u, .38, hitT) : 0));

  score(S, F) {
    const { I } = S, hash = F.hash;
    const tone = (B, type, pts, peak, d, out) => { const ctx = B.sfx.context, o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; const w = pts[0][0]; o.frequency.setValueAtTime(pts[0][1], w); pts.slice(1).forEach(([tt, f]) => o.frequency.linearRampToValueAtTime(f, tt)); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + .01); g.gain.setValueAtTime(peak, w + d - .05); g.gain.exponentialRampToValueAtTime(.0001, w + d); o.connect(g); g.connect(out || B.sfx); o.start(w); o.stop(w + d + .02); };
    const buzzer = (w, B) => { tone(B, 'sawtooth', [[w, 98], [w + .5, 92]], .16, .5); tone(B, 'square', [[w, 104], [w + .5, 97]], .08, .5); };
    const wahwah = (w, B) => [[67, .0], [66, .22], [65, .44]].forEach(([m, dt]) => { const f = 440 * Math.pow(2, (m - 69) / 12); tone(B, 'square', [[w + dt, f], [w + dt + .18, f * .97]], .05, .2); });
    const fanfare = (w, B, root) => [0, 4, 7, 12].forEach((k, i) => I.chip(w + i * .06, B, root + k, 1.1, i === 3 ? .35 : .08));
    const stab = (w, B, root) => [0, 7, 12, 16].forEach(k => I.chip(w, B, root + k, .8, .12));
    const ups = (w, B, d) => tone(B, 'square', [[w, 200], [w + d, 1600]], .04, d);
    // 片头
    S.at(.02, I.impact); S.at(.02, stab, 60); S.at(.5, I.kick); S.at(.5, stab, 67); S.at(.5, I.pop);
    for (let k = 0; k < 4; k++) S.at(.75 + k * .0625, I.snare, .5 + k * .15);
    GAMES.forEach((g, i) => {
      const bt = 60 / g.bpm, root = 48 + i * 2, n = Math.floor(g.len / bt + .01);
      // 指令砸下：重音 + 短旋律钩子
      S.at(g.t0, I.kick, 1.1); S.at(g.t0, stab, root + 12); S.at(g.t0, I.whip);
      for (let b = 0; b < n; b++) {
        const tb = g.t0 + b * bt, after = tb >= g.t0 + g.len * JUDGE;
        S.at(tb, I.kick, after ? .6 : .85); if (b % 2) S.at(tb, I.snare, .55);
        S.at(tb + bt / 2, I.hat, .8); S.at(tb, I.hat, .5);
        S.at(tb, I.chipTri, root + [0, 12, 7, 12][b % 4], bt * .8);
        if (!after) { const m = root + 24 + [0, 3, 7, 10, 7, 3, 12, 10][(b + i) % 8]; S.at(tb + bt / 2, I.chip, m, .6, bt * .35); }
        // 倒计时滴答（计时条走的那一段）
        if (tb > g.t0 + g.len * .12 && tb < g.t0 + g.len * HIT) S.at(tb, I.tick, 1.2);
      }
      const hitAt = g.t0 + g.len * HIT, jud = g.t0 + g.len * JUDGE;
      // 每关自己的动作音效
      if (i === 0) { S.at(g.t0 + g.len * .14, (w, B) => tone(B, 'sine', [[w, 1200], [w + g.len * .48, 300]], .05, g.len * .48)); S.at(hitAt, I.thud); S.at(hitAt, I.pop); }
      if (i === 1) { S.at(g.t0 + g.len * .24, I.whoosh, .8); S.at(g.t0 + g.len * .44, I.jump); S.at(g.t0 + g.len * .74, I.thud, .5); }
      if (i === 2) { S.at(g.t0 + g.len * .3, I.whoosh, .5); S.at(hitAt, I.click); S.at(hitAt, I.thud, 1); S.at(hitAt + .01, I.pop2); }
      if (i === 3) { S.at(g.t0 + g.len * .38, (w, B) => tone(B, 'sawtooth', [[w, 180], [w + g.len * .24, 260]], .03, g.len * .24)); S.at(hitAt, I.whip); S.at(hitAt, I.pop, .6); }
      if (i === 4) { S.at(g.t0 + g.len * .32, I.whoosh, 1); S.at(hitAt, I.swish); }
      // 判定
      if (g.win) { S.at(jud, I.coin); S.at(jud + .12, fanfare, 72 + i * 2); } else { S.at(jud, buzzer); S.at(jud + .3, wahwah); }
      // 过场：鼓滚 + 上行扫频
      if (i < 4) { const t1 = g.tEnd, gp = GAPS[i]; S.at(t1, ups, gp); const rolls = Math.floor(gp / .05); for (let k = 0; k < rolls; k++) S.at(t1 + k * .05, I.snare, .25 + .5 * k / rolls); S.at(t1 + .05, I.tom, 45 + i * 2); }
    });
    // 结算：号角式芯片旋律
    const T = T_FINAL;
    S.at(T, I.impact); S.at(T, I.kick, 1.2);
    [72, 76, 79, 84, 79, 84, 88].forEach((m, k) => S.at(T + .05 + k * .12, I.chip, m, 1, k === 6 ? .8 : .1));
    [0, 1, 2, 3, 4].forEach(k => S.at(T + .05 + k * .07, I.blip, k));
    for (let b = 0; b < 6; b++) { S.at(T + .5 + b * .25, I.kick, .8); S.at(T + .5 + b * .25 + .125, I.hat, .8); S.at(T + .5 + b * .25, I.chipTri, [48, 55, 52, 55, 48, 60][b], .2); }
    S.at(T + .95, I.coin); S.at(T + 1.2, (w, B) => [60, 64, 67, 72].forEach(m => I.chip(w, B, m, .9, .9)));
    void hash;
  }
});
