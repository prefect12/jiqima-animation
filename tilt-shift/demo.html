        const b = P([x, y, 0]), tp = P([x, y, 5.2]);
        s.strokeStyle = '#3A3F47'; s.lineWidth = 3; s.beginPath(); s.moveTo(b[0], b[1]); s.lineTo(tp[0], tp[1]); s.stroke();
        s.fillStyle = '#23262B'; F.rrect(s, tp[0] - 5, tp[1] - 20, 10, 24, 3); s.fill();
        const st = dir === 'ns' ? nsCol : ewCol;
        [['r', '#FF3B30', -15], ['y', '#FFCC00', -8], ['g', '#34E36B', -1]].forEach(([k3, col, dy]) => {
          const on = k3 === st && !(st === 'y' && Math.floor(t * 6) % 2);
          s.fillStyle = on ? col : '#4A4D52'; s.beginPath(); s.arc(tp[0], tp[1] + dy, 2.8, 0, 7); s.fill();
          if (on) { const g = s.createRadialGradient(tp[0], tp[1] + dy, 0, tp[0], tp[1] + dy, 16); g.addColorStop(0, col + 'AA'); g.addColorStop(1, col + '00'); s.fillStyle = g; s.fillRect(tp[0] - 16, tp[1] + dy - 16, 32, 32); }
        });
      } });
    });
    // 影子层：统一用冷色半透明叠一次，重叠处不会越叠越黑
    s.save(); s.setTransform(1, 0, 0, 1, 0, 0); s.globalAlpha = .34; s.globalCompositeOperation = 'multiply';
    sh.save(); sh.setTransform(1, 0, 0, 1, 0, 0); sh.globalCompositeOperation = 'source-in'; sh.fillStyle = '#2A3A6A'; sh.fillRect(0, 0, cw, ch); sh.restore(); sh.globalCompositeOperation = 'source-over';
    s.drawImage(SH, 0, 0); s.restore();
    objs.sort((a, b) => b.z - a.z).forEach(o => o.d());
    // 早晨的暖光雾
    const hz = s.createLinearGradient(0, 0, 0, H); hz.addColorStop(0, 'rgba(255,214,160,.22)'); hz.addColorStop(.5, 'rgba(255,214,160,0)'); s.fillStyle = hz; s.fillRect(0, 0, W, H);
    /* ---------- 移轴：上下两层模糊，按渐变遮罩叠回 ---------- */
    c.drawImage(SC, 0, 0, W, H);
    const blurLayer = (B, px, stops) => {
      const g = B.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy'; g.filter = `blur(${px}px)`; g.drawImage(SC, 0, 0, B.width, B.height); g.filter = 'none';
      g.globalCompositeOperation = 'destination-in'; const m = g.createLinearGradient(0, 0, 0, B.height); stops.forEach(([p, a]) => m.addColorStop(p, `rgba(0,0,0,${a})`)); g.fillStyle = m; g.fillRect(0, 0, B.width, B.height); g.globalCompositeOperation = 'source-over';
      c.drawImage(B, 0, 0, W, H);
    };
    blurLayer(B1, 2.2 * k, [[0, 1], [.36, 0], [.64, 0], [1, 1]]);
    blurLayer(B2, 2.6 * k, [[0, 1], [.24, 0], [.8, 0], [1, 1]]);
    c.fillStyle = 'rgba(255,255,255,.04)'; c.fillRect(0, 0, W, H);
    F.vignette(c, .28, '30,20,40');
    /* ---------- 字幕：早高峰 + 时钟（延时：1 秒 = 1 分钟） ---------- */
    const a = clamp(prog(t, .3, .8), 0, 1) * (1 - prog(t, 13.8, 14.4));
    if (a > 0) {
      c.globalAlpha = a; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
      c.fillStyle = 'rgba(20,24,34,.55)'; F.rrect(c, 48, 44, 250, 110, 16); c.fill();
      c.font = '900 44px "Noto Sans SC", sans-serif'; c.fillStyle = '#FFFFFF'; c.fillText('早高峰', 72, 104);
      const m = 52 + Math.floor(t), hh = m >= 60 ? '08' : '07', mm = String(m % 60).padStart(2, '0');
      c.font = '500 30px "Noto Sans SC", sans-serif'; c.fillStyle = '#FFD166'; c.fillText(`${hh}:${mm}`, 72, 140);
      c.globalAlpha = 1;
    }
    const fo = prog(t, 14.45, 15); if (fo > 0) { c.fillStyle = `rgba(245,236,220,${fo})`; c.fillRect(0, 0, W, H); }
  },
  score(S) {
    const { I, beat, bar } = S;
    // 轻快城市律动：D – A – Bm – G；绿灯之前没有底鼓（滤波般的铺垫），绿灯一亮全鼓进来
    const PR = [[62, 66, 69], [61, 64, 69], [59, 62, 66], [59, 62, 67]], RT = [38, 33, 35, 31];
    const GOB = Math.round(T_GO / bar);
    for (let b = 0; b < 8; b++) {
      const ch = PR[b % 4], t0 = b * bar;
      [0, 1.5, 2.5, 3].forEach((r, i) => S.at(t0 + r * beat, (w, B) => ch.forEach(m => I.keys(w, B, m + 12, i ? .55 : .8, .4))));
      [0, .75, 1.5, 2, 2.75, 3.5].forEach((r, i) => S.at(t0 + r * beat, I.marimba, ch[i % 3] + 24, .3));
      if (b >= GOB) { S.drums(b, b + 1, 'four', .7); S.bassLine([RT[b % 4]], b, b + 1, .8); }
      else { for (let e = 0; e < 8; e++) S.at(t0 + e * beat / 2, I.shaker, .8); S.at(t0, I.bass, RT[b % 4], 1.6, .6); S.at(t0 + 2 * beat, I.rim, .6); }
    }
    // 黄灯 / 红灯提示、绿灯的一记重拍
    S.at(T_EW_Y, I.tick, 1.5); S.at(T_EW_R, I.tick, 1.5); S.at(T_GO - bar / 2, I.riser, bar / 2);
    S.at(T_GO, I.impact); S.at(T_GO, I.clap, 1.2);
    // 车喇叭“哔哔”：两个方波叠成的小喇叭
    const horn = (w, B, f = 420, v = 1) => { [0, .16].forEach(d => { [f, f * 1.26].forEach(fq => { const ctx = B.sfx.context, o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); o.type = 'square'; o.frequency.value = fq; lp.type = 'lowpass'; lp.frequency.value = 2200; g.gain.setValueAtTime(.0001, w + d); g.gain.exponentialRampToValueAtTime(.05 * v, w + d + .01); g.gain.setValueAtTime(.05 * v, w + d + .1); g.gain.exponentialRampToValueAtTime(.0001, w + d + .13); o.connect(lp); lp.connect(g); g.connect(B.sfx); o.start(w + d); o.stop(w + d + .15); }); }); };
    S.at(2.1, horn, 380, .7); S.at(T_GO + .45, horn, 460, 1); S.at(T_GO + 1.1, horn, 350, .8); S.at(12.4, horn, 410, .8);
    // 行人过街提示音：绿灯期间“嘀嘀嘀”
    for (let x = T_GO + .1; x < T_PED_END; x += beat / 2) S.at(x, (w, B) => { const ctx = B.sfx.context, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = 2350; g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.035, w + .005); g.gain.exponentialRampToValueAtTime(.0001, w + .06); o.connect(g); g.connect(B.sfx); o.start(w); o.stop(w + .08); });
    // 车一齐起步：一阵引擎 whoosh
    for (let i = 0; i < 4; i++) S.at(T_GO + .1 + i * .18, I.whoosh, .35);
    S.at(14.2, I.bell, 86, .6);
  }
});
