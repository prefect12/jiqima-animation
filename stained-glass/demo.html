      const rg = c.createLinearGradient(0, WTOP, 0, 700); rg.addColorStop(0, `rgba(255,220,170,${.07 * pa})`); rg.addColorStop(1, `rgba(255,220,170,${.02 * pa})`);
      c.fillStyle = rg; path(c, quad); c.fill();
      for (let i = 0; i < 60; i++) { const u = hash(i * 1.3), v = (hash(i * 7.7) + t * (.02 + hash(i) * .03)) % 1; const x = lerp(lerp(WX0 + 30, WX1 - 20, u), lerp(WX0 + 270, WX1 + 270, u), v), y = lerp(WTOP + 80, 700, v); c.fillStyle = `rgba(255,236,200,${(.25 + .4 * hash(i * 3)) * pa})`; c.beginPath(); c.arc(x + 4 * Math.sin(t * .8 + i), y, .8 + hash(i * 5) * 1.4, 0, 7); c.fill(); }
      c.filter = 'blur(5px)'; c.globalAlpha = .75 * Math.min(1, pa);
      c.transform(1, 0, -.42, -.22, WBOT * .42 + 60, 590 + WBOT * .22); // flatten + shear the window onto the floor
      c.drawImage(GLOW, WX0, WTOP, 480, 500);
      c.restore();
    }
    c.restore();
    // title
    if (t > TITLE) { const a = easeOut(prog(t, TITLE, TITLE + .8)); c.save(); c.globalAlpha = a * .92; c.font = `600 34px ${SERIF}`; c.textAlign = 'center'; c.fillStyle = '#F3E3C3'; c.shadowColor = 'rgba(255,200,120,.6)'; c.shadowBlur = 16; c.fillText('光 里 的 鲸', 640, 648); c.restore(); }
    F.vignette(c, .55, '0,0,0');
    F.grain(c, t, .05);
    const fo = prog(t, OUT, 15); if (fo > 0) { c.fillStyle = `rgba(0,0,0,${fo})`; c.fillRect(0, 0, W, H); }
  },
  score(S) {
    const { I, beat, bar } = S;
    // D major, slow: strings pad + church bells; each lit group rings a bell on its eighth note
    const PR = [[50, 57, 62, 66], [47, 54, 59, 62], [43, 50, 55, 59], [45, 52, 57, 61]];
    S.at(0, (w, B) => I.strings(w, B, [38, 45, 50], 3.2, .9));
    for (let b = 1; b < 6; b++) S.at(b * bar - .2, (w, B) => I.strings(w, B, PR[b % 4], bar + .6, 1.1));
    for (let b = 1; b < 6; b++) S.at(b * bar, I.subbass, PR[b % 4][0] - 12, bar * .9, .6);
    const PENT = [74, 76, 78, 81, 83, 86, 88, 90, 93, 95];
    const times = [...new Set(CELLS.map(cl => +cl.tc.toFixed(3)))].sort((a, b) => a - b);
    times.forEach((x, i) => { S.at(x, I.bell, PENT[i % PENT.length] - 12, .55); S.at(x, I.shimmer); });
    // whale: a low marimba step each eighth, bubbles on the beat
    for (let k = 1; k <= STEPS; k++) S.at(SWIM0 + k * E, I.marimba, [50, 54, 57, 62][k % 4], .5);
    for (let b = 0; b < 12; b++) S.at(SWIM0 + (b + 1) * BEAT, I.pop2);
    // spout: rising harp + big bell
    for (let k = 0; k < 10; k++) S.at(SPOUT + k * E / 2, I.mbox, 74 + [0, 4, 7, 12, 16, 19, 24, 28, 31, 36][k] - 12, .8);
    S.at(SPOUT, I.bell, 62, 1.2); S.at(SPOUT, I.bell, 50, 1); S.at(SPOUT - .8, I.riser, .8);
    S.at(SPOUT + .1, (w, B) => I.strings(w, B, [50, 57, 62, 66, 69], 3.2, 1.3));
    S.at(TITLE, I.chime);
    S.at(OUT - .6, I.bell, 62, .6);
  }
});
