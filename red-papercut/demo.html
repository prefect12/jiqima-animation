      CUTS.forEach((ct, k) => { if (ct.outline) return; ct.shapes.forEach((sp, j) => { const u = prog(t, ct.t1 + hash(k * 7 + j) * .15, ct.t1 + .55); if (u <= 0 || u >= 1) return; const [px, py] = sp[0]; c.save(); c.translate(px + (hash(k + j * 3) - .5) * 60 * u, py + 240 * u * u); c.rotate((hash(j + k) - .5) * 6 * u); c.translate(-px, -py); c.globalAlpha = 1 - u * u; c.beginPath(); poly(c, sp); c.fillStyle = RED; c.fill(); c.restore(); }); });

    } else {

        const g = TF.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, TF.width, TF.height); g.drawImage(PC, 0, 0);
        g.globalCompositeOperation = 'source-atop'; g.fillStyle = sx < 0 ? `rgba(60,0,0,${.25 + .2 * lift})` : `rgba(60,0,0,${.3 * lift})`; g.fillRect(0, 0, TF.width, TF.height); g.globalCompositeOperation = 'source-over';
        c.save(); c.scale(-sx, 1); shadowed(() => c.drawImage(TF, -310, -270, 320, 540), lift); c.restore();
        c.restore();
      } else {

        const g = PF.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, PF.width, PF.height);
        g.setTransform(SS, 0, 0, SS, 320 * SS, 270 * SS); g.drawImage(PC, -310, -270, 320, 540); g.save(); g.scale(-1, 1); g.drawImage(PC, -310, -270, 320, 540); g.restore();
        g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(70,0,0,.28)'; g.fillRect(-1.2, -270, 1.6, 540); g.fillStyle = 'rgba(255,170,160,.22)'; g.fillRect(.4, -270, 1.4, 540); g.restore();   // 折痕

        if (fuU > 0) { g.save(); g.beginPath(); g.rect(-100, -150, 200, 220 * fuU); g.clip(); g.globalCompositeOperation = 'destination-out'; g.font = `124px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('福', 0, MC[1] + 6); g.restore(); }
        const zs = lerp(1, 1.08, ease(prog(t, ...T.glow))), rot = t > T.party[0] ? .02 * Math.sin((t - T.party[0]) * 1.8) : 0, lift = ease(prog(t, ...T.glow));

        const confetti = front => { for (let i = 0; i < 72; i++) { if ((i % 3 === 0) !== front) continue; const u = t - T.party[0] - hash(i) * 2.2; if (u < 0) continue; const x = 80 + hash(i + 3) * 1120 + 40 * Math.sin(u * 2 + i), y = -40 + u * (150 + 90 * hash(i + 5)), s = front ? 9 : 7 + 5 * hash(i + 7); c.save(); c.translate(x, y); c.rotate(u * (2 + hash(i + 9) * 3)); c.scale(1, Math.cos(u * 4 + i)); c.fillStyle = i % 2 ? RED : GOLD; c.beginPath(); if (i % 4 === 0) { for (let q = 0; q < 4; q++) { c.ellipse(Math.cos(q * Math.PI / 2) * s * .5, Math.sin(q * Math.PI / 2) * s * .5, s * .55, s * .28, q * Math.PI / 2, 0, Math.PI * 2); } } else { c.moveTo(0, -s); c.lineTo(s * .7, 0); c.lineTo(0, s); c.lineTo(-s * .7, 0); c.closePath(); } c.fill(); c.restore(); } };
        confetti(false);
        c.save(); c.translate(640, cy); c.rotate(rot); c.scale(zs, zs);
        c.save(); c.filter = 'brightness(.6)'; c.drawImage(PF, -320 + 1.6, -270 + 2.2, 640, 540); c.restore();
        shadowed(() => c.drawImage(PF, -320, -270, 640, 540), lift);
        // 剪福那一下：剪刀快速走一个之字
        if (t > T.fu[0] - .3 && t < T.fu[1] + .4) { const u = prog(t, T.fu[0], T.fu[1]), zx = 46 * Math.sin(u * Math.PI * 5), zy = -150 + 220 * u; const ent = prog(t, T.fu[0] - .3, T.fu[0]), ex = prog(t, T.fu[1], T.fu[1] + .4); drawScissors(c, zx + 300 * (1 - ent) + 400 * ex * ex, zy - 60 * (1 - ent) + 200 * ex * ex, -.9, .26 * (.5 + .5 * Math.cos(t * Math.PI * 16))); }

    }
    const fo = prog(t, ...T.fade); if (fo > 0) { c.fillStyle = `rgba(120,20,12,${fo})`; c.fillRect(0, 0, W, H); }
  },
  score(S) {
    const { I, beat, bar } = S;
    S.at(0, I.whoosh, .6); S.at(T.drop[1] - .05, I.paper); S.at(T.drop[1], X.dagu, .7);
    S.at(T.fold[0] + .1, I.paper); S.at(T.fold[0] + .5, I.swish); S.at(T.fold[1], X.dagu, .8); S.at(T.fold[1], X.cymbal, .45, .3); S.at(T.fold[1] + .05, I.paper);
    // 剪：刀口一开一合 = 每个八分音符一“咔嚓”
    CUTS.forEach(c => { for (let x = Math.ceil(c.t0 / (beat / 2)) * beat / 2; x < c.t1; x += beat / 2) S.at(x, X.snip, .9); });
    S.at(T.fall, I.whoosh, .5); S.at(T.fall + .6, I.paper);
    // 剪纸时的伴奏：木鱼 + 小锣，轻
    for (let b = 4; b < 16; b++) { S.at(b * beat, X.bangzi, b % 2 ? .45 : .8); if (b % 4 === 2) S.at(b * beat, X.xiaoluo, .35); }
    for (let b = 4; b < 16; b += 2) S.at(b * beat, I.pizz, [50, 57, 54, 57][(b / 2) % 4], .6);
    const OST = [74, 78, 81, 78, 76, 78, 74, 71];            // 剪纸时的拨弦小循环（D 宫五声）
    for (let e = 8; e < 36; e++) S.at(e * beat / 2, I.pluck, OST[e % 8] - (e >= 24 ? 2 : 0), .55);
    for (let b = 4; b < 18; b++) S.at(b * beat + beat / 2, I.shaker, .8);
    // 展开：一串板鼓推上去 → 大锣 + 钹
    for (let i = 0; i < 8; i++) S.at(T.unfold[0] + i * beat / 4, X.bangu, .5 + i * .06);
    S.at(T.unfold[0], I.riser, 1.0);
    S.at(T.unfold[1], X.gong, 130, 1.2, 2.6, .93); S.at(T.unfold[1], X.cymbal, 1); S.at(T.unfold[1], X.dagu, 1);
    // 剪福：四下快剪 → 亮
    for (let i = 0; i < 4; i++) S.at(T.fu[0] + i * beat / 4, X.snip, 1);
    S.at(T.fu[1], I.chime); S.at(T.fu[1], X.cymbal, .6, .4);
    // 喜庆段：唢呐 + 锣鼓 + 鞭炮
    const MEL = [[0, 74, .5], [.5, 76, .5], [1, 78, .5], [1.5, 81, .5], [2, 83, 1], [3, 81, .5], [3.5, 78, .5], [4, 81, 1], [5, 78, .5], [5.5, 76, .5], [6, 74, 1.5], [7.5, 76, .5], [8, 78, 1], [9, 81, .5], [9.5, 83, .5], [10, 86, 2]];
    const m0 = T.unfold[1] + beat;
    MEL.forEach(([b, m, d]) => S.at(m0 + b * beat, X.suona, m, d * beat));
    for (let b = 0; b < 9; b++) { const x = T.unfold[1] + b * beat; S.at(x, X.dagu, b % 2 ? .5 : .9); S.at(x + beat / 2, X.cymbal, .3, .15); if (b % 2) S.at(x, X.xiaoluo, .5); }
    for (let k = 0; k < 3; k++) S.at(T.party[0] + .2 + k * .8, X.crackers, 10 + k * 3);
    S.at(14.0, X.gong, 110, 1, 2.2, .93); S.at(14.0, X.cymbal, .8);
  }
});

/* ---------- 自己合成的：剪刀、锣、钹、鼓、梆子、唢呐、鞭炮 ---------- */
const NB = new WeakMap();
function nbuf(ctx) { let b = NB.get(ctx); if (!b) { b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; NB.set(ctx, b); } return b; }
function tone(ctx, out, type, f0, w, a, d, peak, f1) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, w); if (f1) o.frequency.exponentialRampToValueAtTime(f1, w + a + d * .7); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + a); g.gain.exponentialRampToValueAtTime(.0001, w + a + d); o.connect(g); g.connect(out); o.start(w); o.stop(w + a + d + .05); return o; }
function hiss(ctx, out, w, d, peak, type, f, q, f1) { const s = ctx.createBufferSource(); s.buffer = nbuf(ctx); const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, w); fl.Q.value = q; if (f1) fl.frequency.exponentialRampToValueAtTime(f1, w + d * .8); const g = ctx.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(peak, w + .003); g.gain.exponentialRampToValueAtTime(.0001, w + d); s.connect(fl); fl.connect(g); g.connect(out); s.start(w, Math.random() * .4); s.stop(w + d + .05); }
const X = {
  snip: (w, B, v = 1) => { const ctx = B.sfx.context; hiss(ctx, B.sfx, w, .045, .28 * v, 'bandpass', 5200, 2.5); tone(ctx, B.sfx, 'sine', 3400, w, .001, .03, .06 * v, 2600); hiss(ctx, B.sfx, w + .05, .03, .12 * v, 'highpass', 6000, 1); },
  gong: (w, B, f = 120, v = 1, d = 2.4, rise = .94) => { const ctx = B.sfx.context; [1, 1.52, 2.18, 2.73, 3.41, 4.3].forEach((k, i) => tone(ctx, B.sfx, 'sine', f * k, w, .006, d / (1 + i * .35), .16 * v / (1 + i * .5), f * k * rise)); hiss(ctx, B.sfx, w, .6, .07 * v, 'bandpass', f * 8, 1.2); },
  xiaoluo: (w, B, v = 1) => X.gong(w, B, 560, .75 * v, .8, 1.12),
  cymbal: (w, B, v = 1, d = .7) => { const ctx = B.sfx.context; hiss(ctx, B.sfx, w, d, .22 * v, 'highpass', 4200, .7); hiss(ctx, B.sfx, w, d * .6, .12 * v, 'bandpass', 2600, 3); },
  bangzi: (w, B, v = 1) => { const ctx = B.drum.context; tone(ctx, B.drum, 'sine', 1180, w, .001, .07, .3 * v); tone(ctx, B.drum, 'square', 2360, w, .001, .02, .04 * v); },
  bangu: (w, B, v = 1) => { const ctx = B.drum.context; tone(ctx, B.drum, 'sine', 720, w, .001, .09, .35 * v, 380); hiss(ctx, B.drum, w, .04, .12 * v, 'bandpass', 3000, 2); },
  dagu: (w, B, v = 1) => { const ctx = B.drum.context; tone(ctx, B.drum, 'sine', 110, w, .003, .4, .7 * v, 55); hiss(ctx, B.drum, w, .08, .12 * v, 'lowpass', 900, 1); },
  suona: (w, B, m, d = .5, v = 1) => {
    const ctx = B.lead.context, f = 440 * Math.pow(2, (m - 69) / 12), g = ctx.createGain(), bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 1.1;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 6.5; lg.gain.setValueAtTime(0, w); lg.gain.linearRampToValueAtTime(f * .02, w + Math.min(.3, d * .7)); lfo.connect(lg);
    [['sawtooth', 1], ['square', 1.004]].forEach(([ty, k]) => { const o = ctx.createOscillator(); o.type = ty; o.frequency.setValueAtTime(f * k * .96, w); o.frequency.exponentialRampToValueAtTime(f * k, w + .05); lg.connect(o.frequency); o.connect(bp); o.start(w); o.stop(w + d + .15); });
    g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.12 * v, w + .03); g.gain.linearRampToValueAtTime(.1 * v, w + Math.max(.05, d - .05)); g.gain.exponentialRampToValueAtTime(.0001, w + d + .1);
    bp.connect(g); g.connect(B.lead); lfo.start(w); lfo.stop(w + d + .15);
  },
  crackers: (w, B, n = 10) => { const ctx = B.sfx.context; for (let i = 0; i < n; i++) { const x = w + i * .055 + Math.random() * .04; hiss(ctx, B.sfx, x, .05, .35, 'bandpass', 1800 + Math.random() * 2500, 1.2); tone(ctx, B.sfx, 'sine', 180, x, .001, .04, .15, 80); } }
};
